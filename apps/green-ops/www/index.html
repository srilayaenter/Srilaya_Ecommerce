<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SriLaYa Green Ops - Mobile App</title>
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlNyaUxhWWEgR3JlZW4gT3BzIiwKICAic2hvcnRfbmFtZSI6ICJHcmVlbk9wcyIsCiAgInN0YXJ0X3VybCI6ICIuLyIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI2YzZjRmNiIsCiAgInRoZW1lX2NvbG9yIjogIiMwNjVmNDYiLAogICJpY29ucyI6IFsKICAgIHsgInNyYyI6ICIuL2ljb25zL2ljb24tMTkyLnBuZyIsICJzaXplcyI6ICIxOTJ4MTkyIiwgInR5cGUiOiAiaW1hZ2UvcG5nIiwgInB1cnBvc2UiOiAiYW55IiB9LAogICAgeyAic3JjIjogIi4vaWNvbnMvaWNvbi01MTIucG5nIiwgInNpemVzIjogIjUxMng1MTIiLCAidHlwZSI6ICJpbWFnZS9wbmciLCAicHVycG9zZSI6ICJhbnkiIH0sCiAgICB7ICJzcmMiOiAiLi9pY29ucy9pY29uLW1hc2thYmxlLTE5Mi5wbmciLCAic2l6ZXMiOiAiMTkyeDE5MiIsICJ0eXBlIjogImltYWdlL3BuZyIsICJwdXJwb3NlIjogIm1hc2thYmxlIiB9LAogICAgeyAic3JjIjogIi4vaWNvbnMvaWNvbi1tYXNrYWJsZS01MTIucG5nIiwgInNpemVzIjogIjUxMng1MTIiLCAidHlwZSI6ICJpbWFnZS9wbmciLCAicHVycG9zZSI6ICJtYXNrYWJsZSIgfQogIF0KfQo=">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="theme-color" content="#065f46">

</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-20 select-none" x-data="srilayaGreenApp()">

  <!-- HEADER -->
  <header class="bg-emerald-800 text-white p-4 sticky top-0 z-50 shadow-md">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="font-bold text-lg leading-tight">SriLaYa Green Ops</h1>
        <p class="text-xs text-emerald-200"><span x-text="lang === 'ta' ? 'நலம், முடி, சருமம் & வீட்டுப் பராமரிப்பு அளவு மேலாளர்' : 'Wellness, Hair, Skin & Home Care Batch Manager'"></span> <span class="text-emerald-400 opacity-70">v1.0</span></p>
      </div>
      <div class="flex items-center gap-2">
        <button @click="lang = lang === 'en' ? 'ta' : 'en'" title="Switch language" class="text-xs px-2 py-1.5 rounded-lg border border-white/60 text-white font-semibold hover:bg-white/10" x-text="lang === 'en' ? 'தமிழ்' : 'English'"></button>
        <button x-show="isUnlocked" @click="lockEditing()" title="Lock editing again" class="text-xs px-2 py-1.5 rounded-lg border border-white/60 text-white hover:bg-white/10">🔓</button>
        <button @click="requireUnlock(() => openAddModal())" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1">
          <span>+ Add Recipe</span>
        </button>
      </div>
    </div>
    <!-- Sync status bar -->
    <button @click="syncFromCloud()" class="mt-2 text-[10px] text-emerald-200 hover:text-white flex items-center gap-1 opacity-80 hover:opacity-100">
      <span x-show="syncStatus === 'syncing'">🔄 Syncing recipes…</span>
      <span x-show="syncStatus === 'synced'">☁️ Recipes synced — tap to refresh</span>
      <span x-show="syncStatus === 'offline'">⚠️ Offline — showing last-synced data</span>
      <span x-show="syncStatus === 'idle'">☁️ Tap to sync recipes</span>
    </button>
  </header>

  <main class="p-4 max-w-lg mx-auto">

    <!-- SEARCH & FILTER -->
    <div class="mb-4 space-y-2">
      <input type="text" x-model="searchQuery" :placeholder="t('searchPlaceholder')"
             class="w-full p-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 bg-white shadow-sm">

      <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
        <button @click="selectedCategory = 'All'" :class="selectedCategory === 'All' ? 'bg-emerald-800 text-white' : 'bg-white text-slate-600'" class="px-3 py-1.5 rounded-lg border font-medium whitespace-nowrap shadow-sm"><span x-text="t('allItems')"></span> (<span x-text="items.length"></span>)</button>
        <button @click="selectedCategory = 'Wellness'" :class="selectedCategory === 'Wellness' ? 'bg-purple-700 text-white' : 'bg-white text-slate-600'" class="px-3 py-1.5 rounded-lg border font-medium whitespace-nowrap shadow-sm" x-text="t('catWellness')"></button>
        <button @click="selectedCategory = 'Hair Care'" :class="selectedCategory === 'Hair Care' ? 'bg-rose-700 text-white' : 'bg-white text-slate-600'" class="px-3 py-1.5 rounded-lg border font-medium whitespace-nowrap shadow-sm" x-text="t('catHairCare')"></button>
        <button @click="selectedCategory = 'Skincare'" :class="selectedCategory === 'Skincare' ? 'bg-blue-700 text-white' : 'bg-white text-slate-600'" class="px-3 py-1.5 rounded-lg border font-medium whitespace-nowrap shadow-sm" x-text="t('catSkincare')"></button>
        <button @click="selectedCategory = 'Household'" :class="selectedCategory === 'Household' ? 'bg-amber-700 text-white' : 'bg-white text-slate-600'" class="px-3 py-1.5 rounded-lg border font-medium whitespace-nowrap shadow-sm" x-text="t('catHousehold')"></button>
        <button @click="selectedCategory = 'Lye-Free'" :class="selectedCategory === 'Lye-Free' ? 'bg-teal-700 text-white' : 'bg-white text-slate-600'" class="px-3 py-1.5 rounded-lg border font-medium whitespace-nowrap shadow-sm" x-text="t('catLyeFree')"></button>
        <button @click="selectedCategory = 'Cold Process'" :class="selectedCategory === 'Cold Process' ? 'bg-orange-700 text-white' : 'bg-white text-slate-600'" class="px-3 py-1.5 rounded-lg border font-medium whitespace-nowrap shadow-sm" x-text="t('catColdProcess')"></button>
      </div>
    </div>

    <!-- BACKUP / RESTORE -->
    <div x-show="activeTab === 'catalog'" class="flex gap-2 mb-3 text-xs">
      <button @click="exportAllData()" class="flex-1 bg-white border border-slate-300 text-slate-600 py-1.5 rounded-lg font-medium hover:bg-slate-50" x-text="t('backup')"></button>
      <label class="flex-1 bg-white border border-slate-300 text-slate-600 py-1.5 rounded-lg font-medium hover:bg-slate-50 text-center cursor-pointer">
        <span x-text="t('restore')"></span>
        <input type="file" accept="application/json,.json" class="hidden" @change="importAllData($event)">
      </label>
      <button @click="restoreDefaults()" class="flex-1 bg-amber-50 border border-amber-300 text-amber-700 py-1.5 rounded-lg font-medium hover:bg-amber-100">↩ Restore Defaults</button>
    </div>

    <!-- TAB 1: CATALOG VIEW -->
    <div x-show="activeTab === 'catalog'" class="space-y-3">
      <template x-for="item in filteredItems" :key="item.id">
        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full" :class="categoryBadgeClass(item.category)" x-text="categoryLabel(item.category)"></span>
              <h3 class="font-bold text-slate-900 mt-1 text-sm" x-text="displayName(item)"></h3>
            </div>
          </div>

          <p class="text-xs text-slate-500 mt-1 line-clamp-2" x-text="displayDetails(item)"></p>

          <div class="mt-3 flex gap-2 pt-2 border-t border-slate-100">
            <button @click="openCalculator(item)" class="flex-1 bg-emerald-700 text-white text-xs py-1.5 rounded-lg font-semibold hover:bg-emerald-800 transition" x-text="t('scaleBatch')">
            </button>
            <button @click="requireUnlock(() => openEditModal(item))" title="Edit recipe" class="px-2.5 bg-slate-100 text-slate-600 text-xs py-1.5 rounded-lg border hover:bg-slate-200 font-medium">
              ✏️
            </button>
            <button @click="requireUnlock(() => deleteItem(item))" title="Delete recipe" class="px-2.5 bg-slate-100 text-slate-600 text-xs py-1.5 rounded-lg border hover:bg-red-50 hover:text-red-600 font-medium">
              🗑️
            </button>
            <button @click="exportCSV(item)" title="Export CSV" class="px-2.5 bg-slate-100 text-slate-600 text-xs py-1.5 rounded-lg border hover:bg-slate-200 font-medium">
              📥
            </button>
          </div>
        </div>
      </template>
    </div>

    <!-- TAB 2: BATCH CALCULATOR VIEW -->
    <div x-show="activeTab === 'calculator'" class="bg-white p-4 rounded-xl shadow-md border border-slate-200 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="font-bold text-slate-900 text-base" x-text="t('scalePrefix') + (selectedItem ? displayName(selectedItem) : '')"></h2>
        <button @click="activeTab = 'catalog'" class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-500 font-bold" x-text="t('back')"></button>
      </div>

      <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-200 flex items-center justify-between">
        <label class="text-xs font-bold text-emerald-900" x-text="t('targetYield')"></label>
        <input type="number" step="0.1" min="0.1" x-model="targetYield" class="w-20 p-1.5 text-center font-bold text-sm rounded border border-emerald-400 bg-white">
      </div>

      <div>
        <div class="flex justify-between items-center mb-2">
          <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider" x-text="t('requiredIngredients')"></h4>
          <button @click="resetChecklist()" class="text-[10px] text-slate-400 hover:text-slate-600 font-semibold underline" x-text="t('reset')"></button>
        </div>
        <div class="space-y-1.5">
          <template x-for="(ing, idx) in calculatedIngredients" :key="idx">
            <button type="button" @click="toggleChecked(ing.key)"
                 class="w-full flex justify-between items-center p-2 rounded text-xs border text-left transition"
                 :class="checkedIngredients[ing.key] ? 'bg-emerald-50 border-emerald-300' : 'bg-slate-50 border-slate-200'">
              <span class="font-medium flex items-center gap-2"
                    :class="checkedIngredients[ing.key] ? 'text-slate-400 line-through' : 'text-slate-700'">
                <span x-text="checkedIngredients[ing.key] ? '✅' : '⬜'"></span>
                <span x-text="ing.label"></span>
              </span>
              <span class="font-bold" :class="checkedIngredients[ing.key] ? 'text-slate-400 line-through' : 'text-emerald-800'" x-text="ing.grams + ' g'"></span>
            </button>
          </template>
        </div>
      </div>

      <div x-show="selectedItem && displaySteps(selectedItem).length" class="border-t border-slate-100 pt-3">
        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2" x-text="t('prepSteps')"></h4>
        <ol class="space-y-1.5 list-decimal list-inside">
          <template x-for="(step, idx) in (selectedItem ? displaySteps(selectedItem) : [])" :key="idx">
            <li class="text-xs text-slate-700 leading-relaxed" x-text="step"></li>
          </template>
        </ol>
      </div>
    </div>

  </main>

  <!-- PIN PROMPT MODAL -->
  <div x-show="pinPromptOpen" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl p-4 w-full max-w-xs shadow-xl space-y-3">
      <h3 class="font-bold text-slate-900 border-b pb-2 text-sm">Enter PIN to Edit Recipes</h3>
      <input type="password" inputmode="numeric" x-model="pinInput" @keyup.enter="submitPin()"
             placeholder="PIN" autofocus
             class="w-full p-2 text-sm border rounded text-center tracking-widest"
             :class="pinError ? 'border-red-400' : 'border-slate-300'">
      <p x-show="pinError" class="text-xs text-red-600 font-medium">Incorrect PIN. Try again.</p>
      <div class="flex gap-2 pt-1">
        <button @click="submitPin()" class="flex-1 bg-emerald-800 text-white text-xs py-2 rounded font-bold">Unlock</button>
        <button @click="cancelPinPrompt()" class="px-3 bg-slate-200 text-slate-600 text-xs py-2 rounded font-medium">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ADD RECIPE MODAL -->
  <div x-show="showAddModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl p-4 w-full max-w-sm shadow-xl max-h-[85vh] overflow-y-auto space-y-3">
      <h3 class="font-bold text-slate-900 border-b pb-2 text-sm" x-text="editingItemId ? 'Edit Recipe' : 'Add New Recipe / Variety'"></h3>

      <input type="text" x-model="newRecipe.name" placeholder="Recipe Name (e.g., Vetiver Cooling Soap)" class="w-full p-2 text-xs border rounded">
      <select x-model="newRecipe.category" class="w-full p-2 text-xs border rounded bg-white">
        <option value="Wellness">🌿 Wellness &amp; Oral Care</option>
        <option value="Hair Care">💆 Hair Care</option>
        <option value="Skincare">🧼 Skincare &amp; Bathing</option>
        <option value="Household">🏡 Household &amp; Eco-Cleaning</option>
        <option value="Lye-Free">🧼 Lye-Free Soaps</option>
        <option value="Cold Process">🧪 Cold Process Soaps</option>
      </select>

      <div class="border-t pt-2 space-y-1.5">
        <div class="flex justify-between items-center">
          <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Ingredients (by parts)</h4>
          <button @click="addIngredientRow()" type="button" class="text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded font-semibold">+ Add</button>
        </div>

        <template x-for="(ing, idx) in newRecipe.ingredients" :key="idx">
          <div class="space-y-0.5">
            <div class="flex gap-1 items-center">
              <input type="text" x-model="ing.name" list="ingredientNames" placeholder="Ingredient name"
                     class="flex-[2] min-w-0 p-1.5 text-xs border rounded">
              <input type="number" x-model.number="ing.parts" placeholder="Parts" min="0" step="0.5"
                     class="w-16 p-1.5 text-xs border rounded text-center">
              <button @click="removeIngredientRow(idx)" type="button"
                      class="text-slate-400 hover:text-red-600 px-1 font-bold" :disabled="newRecipe.ingredients.length === 1">✕</button>
            </div>
            <p class="text-[10px] text-slate-400 pl-0.5" x-show="ing.name && ing.parts" x-text="ingredientPreviewPct(ing) + ' of batch'"></p>
          </div>
        </template>
        <datalist id="ingredientNames">
          <template x-for="name in allIngredientNames" :key="name">
            <option :value="name"></option>
          </template>
        </datalist>
      </div>

      <textarea x-model="newRecipe.details" placeholder="Processing Notes (optional)" class="w-full p-2 text-xs border rounded h-14"></textarea>

      <div class="flex gap-2 pt-2">
        <button @click="saveNewRecipe()" :disabled="!canSaveNewRecipe"
                class="flex-1 bg-emerald-800 text-white text-xs py-2 rounded font-bold disabled:opacity-40 disabled:cursor-not-allowed" x-text="editingItemId ? 'Save Changes' : 'Save Recipe'"></button>
        <button @click="cancelNewRecipe()" class="px-3 bg-slate-200 text-slate-600 text-xs py-2 rounded font-medium">Cancel</button>
      </div>
    </div>
  </div>

  <!-- NAVIGATION BAR -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 flex justify-around p-2 text-xs z-40 shadow-lg">
    <button @click="activeTab = 'catalog'" :class="activeTab === 'catalog' ? 'text-emerald-800 font-bold' : 'text-slate-400'" class="flex flex-col items-center">
      <span>📚</span><span x-text="t('navCatalog')"></span>
    </button>
    <button @click="activeTab = 'calculator'" :class="activeTab === 'calculator' ? 'text-emerald-800 font-bold' : 'text-slate-400'" class="flex flex-col items-center">
      <span>🧮</span><span x-text="t('navBatchScale')"></span>
    </button>
  </nav>

  <!-- APP SCRIPT -->
  <script>
    function srilayaGreenApp() {
      return {
        activeTab: 'catalog',
        lang: 'en',
        searchQuery: '',
        selectedCategory: 'All',
        showAddModal: false,
        editingItemId: null,
        targetYield: 1.0,
        selectedItem: null,
        checkedIngredients: {},

        // Supabase cloud sync — wire up when green.com DB is live.
        // Table needed: GreenOpsRecipe (id text PK, name text, category text, details text, baseRatios jsonb)
        SUPABASE_URL: '',
        SUPABASE_ANON_KEY: '',
        sbClient: null,
        syncStatus: 'idle', // idle | syncing | synced | offline
        SYNCED_CATEGORIES: ['Wellness', 'Hair Care', 'Skincare', 'Household', 'Lye-Free', 'Cold Process'],
        _lockTimer: null,
        _offlineQueue: [], // [{op:'upsert'|'delete', payload}]

        // Simple shared PIN gate against casual edits by whoever's holding the phone.
        // Not real security — anyone can read this in the page source. Change the PIN here.
        editPin: '2468',
        isUnlocked: false,
        pinPromptOpen: false,
        pinInput: '',
        pinError: false,
        pendingAction: null,

        items: [],

        newRecipe: { name: '', category: 'Wellness', details: '', ingredients: [{ name: '', parts: null }] },

        categoryBadgeClass(category) {
          switch (category) {
            case 'Wellness': return 'bg-purple-100 text-purple-800';
            case 'Hair Care': return 'bg-rose-100 text-rose-800';
            case 'Skincare': return 'bg-blue-100 text-blue-800';
            case 'Household': return 'bg-amber-100 text-amber-800';
            case 'Lye-Free': return 'bg-teal-100 text-teal-800';
            case 'Cold Process': return 'bg-orange-100 text-orange-800';
            default: return 'bg-slate-100 text-slate-800';
          }
        },

        defaultItems: [
          // ==================== WELLNESS & ORAL CARE (SKU-001 to 007) ====================
          { id: 1, name: 'Mooligai Parpodi (Herbal Tooth Powder)', nameTa: 'மூலிகை பற்பொடி', category: 'Wellness', details: 'Karuvelam Pattai (20%), Aalam Pattai (15%), Kadukkai (15%), Nellikai (10%), Thandrikkai (10%), Krambu (5%), Sukku (5%), Milagu (3%), Elakkai (2%), Induppu (10%), Pudina Satva (5%)', detailsTa: 'கருவேலம் பட்டை (20%), ஆலம் பட்டை (15%), கடுக்காய் (15%), நெல்லிக்காய் வற்றல் (10%), தான்றிக்காய் (10%), கிராம்பு (5%), சுக்கு (5%), மிளகு (3%), ஏலக்காய் (2%), இந்துப்பு (10%), புதினா சத்து (5%)', baseRatios: [{name: 'Karuvelam Pattai (Acacia Bark)', nameTa: 'கருவேலம் பட்டை', ratio: 0.20}, {name: 'Aalam Pattai (Banyan Bark)', nameTa: 'ஆலம் பட்டை', ratio: 0.15}, {name: 'Kadukkai (Haritaki)', nameTa: 'கடுக்காய்', ratio: 0.15}, {name: 'Nellikai (Dried Amla)', nameTa: 'நெல்லிக்காய் வற்றல்', ratio: 0.10}, {name: 'Thandrikkai (Bibhitaki)', nameTa: 'தான்றிக்காய்', ratio: 0.10}, {name: 'Krambu (Cloves)', nameTa: 'கிராம்பு', ratio: 0.05}, {name: 'Sukku (Dry Ginger)', nameTa: 'சுக்கு', ratio: 0.05}, {name: 'Milagu (Black Pepper)', nameTa: 'மிளகு', ratio: 0.03}, {name: 'Elakkai (Cardamom)', nameTa: 'ஏலக்காய்', ratio: 0.02}, {name: 'Induppu (Rock Salt)', nameTa: 'இந்துப்பு', ratio: 0.10}, {name: 'Pudina Satva (Menthol Crystals)', nameTa: 'புதினா சத்து', ratio: 0.05}],
            steps: ['Inspection & De-seeding: Clean all raw barks. Crack open and deseed Kadukkai, Nellikai, and Thandrikkai (use shell/flesh only).', 'Sun-Drying: Sun-dry barks and deseeded fruits for 6 to 8 hours until moisture drops below 5%.', 'Dry-Roasting: Lightly roast Sukku, Milagu, Krambu, and Elakkai on low heat for 2 minutes to release essential oils.', 'Pulverization & Sifting: Grind all dried herbs in a heavy-duty mill. Pass through a #100 mesh stainless steel sieve.', 'Blending: Grind Induppu separately. Mortar-and-pestle Pudina Satva into the salt. Combine all powders in a blender for 10 minutes.', 'Packaging: Pack into airtight 50g / 100g jars.'],
            stepsTa: ['கொட்டை நீக்குதல்: கடுக்காய், நெல்லிக்காய், தான்றிக்காயின் கொட்டைகளை நீக்கி தோல்/சதையை மட்டும் எடுக்கவும்.', 'உலர்த்துதல்: மரப்பட்டைகள் மற்றும் மூலிகைகளை 6-8 மணி நேரம் வெயிலில் காயவைக்கவும் (ஈரப்பதம் <5%).', 'வறுவல்: சுக்கு, மிளகு, கிராம்பு, ஏலக்காயை மிதமான தீயில் 2 நிமிடங்கள் வறுக்கவும்.', 'அரைத்தல் & சலித்தல்: அரைவை இயந்திரத்தில் அரைத்து, #100 மெஷ் சல்லடையில் நைஸாக சலிக்கவும்.', 'கலத்தல்: இந்துப்புடன் புதினா சத்தை இடித்துக் கலந்து, மூலிகைப் பொடியுடன் 10 நிமிடங்கள் கலக்கவும்.', 'பேக்கிங்: ஈரம் படாத 50g / 100g பாட்டில்களில் அடைக்கவும்.'] },
          { id: 2, name: 'Natural Lip Balm', nameTa: 'இயற்கை உதட்டு பாம்', category: 'Wellness', details: 'Yellow Beeswax (30%), Unrefined Shea Butter (25%), Cold-Pressed Coconut Oil (25%), Sweet Almond Oil (15%), Vitamin E Oil (3%), Natural Essential Oil (2%)', detailsTa: 'தேன் மெழுகு (30%), ஷியா வெண்ணெய் (25%), தேங்காய் எண்ணெய் (25%), பாதாம் எண்ணெய் (15%), வைட்டமின் ஈ ஆயில் (3%), இயற்கை வாசனை எண்ணெய் (2%)', baseRatios: [{name: 'Yellow Beeswax', nameTa: 'தேன் மெழுகு', ratio: 0.30}, {name: 'Unrefined Shea Butter', nameTa: 'ஷியா வெண்ணெய்', ratio: 0.25}, {name: 'Cold-Pressed Coconut Oil', nameTa: 'தேங்காய் எண்ணெய்', ratio: 0.25}, {name: 'Sweet Almond Oil', nameTa: 'பாதாம் எண்ணெய்', ratio: 0.15}, {name: 'Vitamin E Oil', nameTa: 'வைட்டமின் ஈ ஆயில்', ratio: 0.03}, {name: 'Natural Essential Oil (Peppermint/Rose)', nameTa: 'இயற்கை வாசனை எண்ணெய்', ratio: 0.02}],
            steps: ['Sanitization: Sterilize all melting vessels, glass beakers, and lip balm tubes/tins with 70% isopropyl alcohol.', 'Double Boiler Melting: Combine Beeswax, Shea Butter, and Coconut Oil in a double boiler over low heat. Melt until completely clear (temp ~65°C).', 'Oil Addition: Remove from heat and stir in Sweet Almond Oil until thoroughly blended.', 'Cooling & Actives: Allow mixture to cool to 45°C. Add Vitamin E Oil and Essential Oils; stir gently for 2 minutes to prevent evaporation.', 'Pouring & Setting: Pour warm liquid immediately into 5g tubes/tins using a precision pipette. Allow to set undisturbed for 30 minutes at room temperature.', 'Capping & Labeling: Cap and apply tamper-proof labels once completely solid.'],
            stepsTa: ['சுத்தம் செய்தல்: பாத்திரங்கள் மற்றும் டியூப்களை ஆல்கஹால் கொண்டு கிருமி நீக்கம் செய்யவும்.', 'உருக்குதல்: தேன் மெழுகு, ஷியா வெண்ணெய், தேங்காய் எண்ணெயை டபுள் பாய்லரில் வைத்து உருக்கவும் (~65°C).', 'எண்ணெய் சேர்த்தல்: அடுப்பிலிருந்து இறக்கி பாதாம் எண்ணெயைச் சேர்த்துக் கலக்கவும்.', 'குளிரூட்டல்: வெப்பநிலை 45°C-க்குக் குறைந்ததும் வைட்டமின் ஈ ஆயில் மற்றும் வாசனை எண்ணெய் சேர்க்கவும்.', 'ஊற்றுதல்: சூடான திரவத்தை உடனடியாக 5 கிராம் டியூப்களில் ஊற்றி 30 நிமிடங்கள் ஆறவிடவும்.', 'பேக்கிங்: நன்றாக உறைந்த பிறகு மூடி லேபிள் ஒட்டவும்.'] },
          { id: 3, name: 'Anion Sanitary Pads', nameTa: 'ஆனியன் சானிட்டரி பேட்ஸ்', category: 'Wellness', details: 'Non-Woven Cotton Topsheet, Anion Chip, SAP Absorbent Paper, PE Backing Film, Adhesive & Glue, Wrapper Film (per 1,000 pads — ratios by material cost share)', detailsTa: 'ஆர்கானிக் காட்டன் மேலடுக்கு, ஆனியன் சிப், சூப்பர் அப்ஸார்பண்ட் பேப்பர், மூச்சுவிடக்கூடிய கீழடுக்கு ஃபிலிம், அட்ஹெசிவ் பசை, தனித்தனி பேக்கிங் கவர் (1,000 பேட்களுக்கு — செலவு விகிதப்படி)', baseRatios: [{name: 'Non-Woven Cotton Topsheet', nameTa: 'ஆர்கானிக் காட்டன் மேலடுக்கு', ratio: 0.24}, {name: 'Anion Yellow/Green Chip', nameTa: 'ஆனியன் சிப்', ratio: 0.15}, {name: 'SAP Absorbent Paper Sheet', nameTa: 'சூப்பர் அப்ஸார்பண்ட் பேப்பர்', ratio: 0.36}, {name: 'PE Breathable Backing Film', nameTa: 'மூச்சுவிடக்கூடிய கீழடுக்கு ஃபிலிம்', ratio: 0.12}, {name: 'Food-Grade Back Adhesive & Glue', nameTa: 'அட்ஹெசிவ் பசை', ratio: 0.04}, {name: 'Individual Wrapper Film & Release Paper', nameTa: 'தனித்தனி பேக்கிங் கவர்', ratio: 0.09}],
            steps: ['Cleanroom Prep: Ensure cleanroom conditions (hairnets, gloves, UV air sterilization).', 'Layering: Lay down non-woven cotton topsheet, insert Anion strip directly in the core, place SAP absorbent paper sheet, seal with breathable PE backing film.', 'Embossing & Ultrasonic Sealing: Ultrasonic-seal pad edges to prevent side leakage.', 'Adhesive Application: Apply food-grade glue strips to the back film and attach silicon release paper.', 'Individual Wrapping: Fold pad into 3-fold structure and seal inside individual hygienic wrapper film.', 'Box Packing: Pack 10 pads per outer pouch/box with an indicator strip.'],
            stepsTa: ['சுத்தமான அறை தயாரிப்பு: கிருமி நீக்கம் செய்யப்பட்ட அறையில் கையுறை அணிந்து தொடங்கவும்.', 'அடுக்குகள் அமைத்தல்: காட்டன் மேலடுக்கு ➔ ஆனியன் சிப் ➔ SAP உறிஞ்சும் தாள் ➔ PE கீழடுக்கு ஃபிலிம் வைக்கவும்.', 'சீலிங் செய்தல்: அல்ட்ராசோனிக் மெஷின் மூலம் பக்கவாட்டு ஓரங்களைச் சீல் செய்யவும்.', 'பசை ஒட்டுதல்: பின்புறம் பசை தடவி ரிலீஸ் பேப்பர் ஒட்டவும்.', 'பேக்கிங்: 3-ஆக மடித்து தனித்தனி கவரில் சீல் செய்து, 10 பேட்களாக பாக்ஸில் அடைக்கவும்.'] },
          { id: 4, name: 'Organic Cotton Pads', nameTa: 'ஆர்கானிக் காட்டன் பேட்ஸ்', category: 'Wellness', details: 'Organic Cotton Topsheet, Wood Pulp Core, Biodegradable PLA Backing, Natural Adhesive, Eco Kraft Wrapper (per 1,000 pads — ratios by material cost share)', detailsTa: '100% ஆர்கானிக் காட்டன் மேலடுக்கு, மரக்கூழ் இயற்கை உறிஞ்சு அடுக்கம், மக்கக்கூடிய PLA ஃபிலிம், இயற்கை பசை, கிராஃப்ட் பேப்பர் கவர் (1,000 பேட்களுக்கு — செலவு விகிதப்படி)', baseRatios: [{name: '100% Unbleached Organic Cotton Topsheet', nameTa: '100% ஆர்கானிக் காட்டன் மேலடுக்கு', ratio: 0.34}, {name: 'Wood Pulp & Fluff Core Layer', nameTa: 'மரக்கூழ் இயற்கை உறிஞ்சு அடுக்கம்', ratio: 0.31}, {name: 'Biodegradable PLA Backing Sheet', nameTa: 'மக்கக்கூடிய PLA ஃபிலிம்', ratio: 0.18}, {name: 'Natural Non-Toxic Adhesive Glue', nameTa: 'இயற்கை பசை', ratio: 0.05}, {name: 'Eco Kraft Paper Wrapper', nameTa: 'கிராஃப்ட் பேப்பர் கவர்', ratio: 0.12}],
            steps: ['Material Quality Check: Verify 100% GOTS-certified organic unbleached cotton (zero chlorine/bleach).', 'Core Layering: Sandwich wood pulp core between organic cotton topsheet and PLA biodegradable backing film.', 'Pressure Embossing: Channel-emboss pad surface for optimal fluid distribution.', 'Adhesive & Release Paper: Apply non-toxic adhesive strips and attach eco paper backing.', 'Eco Wrapping: Enclose each pad in individual biodegradable paper wrap. Pack 10 pads per printed kraft box.'],
            stepsTa: ['பரிசோதனை: கெமிக்கல் இல்லாத 100% ஆர்கானிக் காட்டனை உறுதி செய்யவும்.', 'அடுக்குதல்: காட்டன் மேலடுக்கு மற்றும் மக்கக்கூடிய PLA ஃபிலிமுக்கு இடையே மரக்கூழ் அடுக்கை வைக்கவும்.', 'அழுத்துதல்: திரவம் பரவுவதற்காக மேல்பரப்பில் சேனல் எம்போசிங் செய்யவும்.', 'பேக்கிங்: இயற்கை பசை தடவி, மக்கக்கூடிய கவரில் மடித்து 10 பேட்களாக பாக்ஸில் அடைக்கவும்.'] },
          { id: 5, name: 'Herbal Kajal / Eye Liner', nameTa: 'மூலிகை கண் மை', category: 'Wellness', details: 'Castor Oil Carbon Soot (25%), Pure Desi Cow Ghee (30%), Cold-Pressed Castor Oil (20%), Natural Beeswax (15%), Pachai Karpooram (5%), Copper-Infused Almond Soot (5%)', detailsTa: 'கரிசலாங்கண்ணி விளக்கு மை (25%), சுத்தமான பசு நெய் (30%), ஆமணக்கு (20%), இயற்கை தேன் மெழுகு (15%), பச்சை கற்பூரம் (5%), பாதாம் மை (5%)', baseRatios: [{name: 'Castor Oil Carbon Soot (Lamp Black)', nameTa: 'கரிசலாங்கண்ணி விளக்கு மை', ratio: 0.25}, {name: 'Pure Desi Cow Ghee', nameTa: 'சுத்தமான பசு நெய்', ratio: 0.30}, {name: 'Cold-Pressed Castor Oil', nameTa: 'ஆமணக்கு (விளக்கெண்ணெய்)', ratio: 0.20}, {name: 'Natural Beeswax', nameTa: 'இயற்கை தேன் மெழுகு', ratio: 0.15}, {name: 'Pachai Karpooram (Edible Camphor)', nameTa: 'பச்சை கற்பூரம்', ratio: 0.05}, {name: 'Copper-Infused Almond Soot', nameTa: 'பாதாம் மை', ratio: 0.05}],
            steps: ['Soot Collection (Traditional Method): Burn Karisalanganni-soaked cotton wicks in pure Castor Oil under a copper plate. Scrape pure velvet-black soot.', 'Double Boiler Base: Melt Beeswax and Desi Cow Ghee together over low heat in a double boiler until molten.', 'Soot Grinding (Kalvam): Place soot, Pachai Karpooram, and Castor Oil into a stone mortar (Kalvam). Grind for 3 hours until lump-free.', 'Blending Base & Soot: Slowly blend molten ghee-wax mixture into the ground soot. Stir continuously for 20 minutes to achieve a smooth cream consistency.', 'Sterilization & Filling: Sterilize 5g glass pots. Pour warm kajal paste into pots while liquid (~40°C).', 'Curing: Allow to cool and solidify for 2 hours before capping.'],
            stepsTa: ['மை எடுத்தல்: கரிசலாங்கண்ணி சாற்றில் தோய்த்த திரியை விளக்கெண்ணெயில் எரித்து, செப்புத் தட்டில் படியும் மையைச் சேகரிக்கவும்.', 'உருக்குதல்: பசு நெய் மற்றும் தேன் மெழுகை உருக்கவும்.', 'கல்வத்தில் அரைத்தல்: சேகரித்த மை, பச்சை கற்பூரம், விளக்கெண்ணெயைக் கல்வத்தில் இட்டு 3 மணி நேரம் நைஸாக அரைக்கவும்.', 'கலத்தல்: உருக்கிய நெய் கலவையை மையுடன் சேர்த்து 20 நிமிடங்கள் கிளறவும்.', 'பேக்கிங்: கண்ணாடி பாட்டில்களில் ஊற்றி 2 மணி நேரம் ஆறவைத்து மூடவும்.'] },
          { id: 6, name: 'Herbal Wellness Drink / Health Mix', nameTa: 'மூலிகை நலபானம்', category: 'Wellness', details: 'Sprouted Ragi Flour (30%), Sprouted Bajra Flour (20%), Roasted Sukku Powder (10%), Ashwagandha Powder (10%), Mulethi Powder (10%), Tulsi Powder (5%), Elakkai (5%), Naattu Sakkarai (10%)', detailsTa: 'முளைகட்டிய ராகி மாவு (30%), முளைகட்டிய கம்பு மாவு (20%), சுக்கு பொடி (10%), அமுக்கரா பொடி (10%), அதிமதுரம் பொடி (10%), துளசி பொடி (5%), ஏலக்காய் (5%), நாட்டுச் சர்க்கரை (10%)', baseRatios: [{name: 'Sprouted Ragi Flour', nameTa: 'முளைகட்டிய ராகி மாவு', ratio: 0.30}, {name: 'Sprouted Bajra Flour', nameTa: 'முளைகட்டிய கம்பு மாவு', ratio: 0.20}, {name: 'Roasted Sukku Powder', nameTa: 'சுக்கு பொடி', ratio: 0.10}, {name: 'Dry Ashwagandha Powder', nameTa: 'அமுக்கரா (அஸ்வகந்தா) பொடி', ratio: 0.10}, {name: 'Mulethi (Licorice) Powder', nameTa: 'அதிமதுரம் பொடி', ratio: 0.10}, {name: 'Tulsi Powder', nameTa: 'துளசி பொடி', ratio: 0.05}, {name: 'Elakkai (Cardamom)', nameTa: 'ஏலக்காய்', ratio: 0.05}, {name: 'Naattu Sakkarai', nameTa: 'நாட்டுச் சர்க்கரை', ratio: 0.10}],
            steps: ['Sprouting & Drying: Soak Ragi and Bajra for 12 hours, sprout for 24 hours, and sun-dry completely.', 'Roasting: Lightly dry-roast sprouted grains, Sukku, and Elakkai on low flame until aromatic.', 'Pulverization: Pulverize grains and herbs through a commercial mill into fine flour (#80 mesh sieve).', 'Blending: Mix in Ashwagandha, Mulethi, Tulsi, and Naattu Sakkarai in a ribbon blender for 15 minutes.', 'Pouch Packaging: Pack into 200g zip-lock aluminum foil stand-up pouches and heat-seal.'],
            stepsTa: ['முளைகட்டுதல்: ராகி, கம்பை 12 மணி நேரம் ஊறவைத்து, 24 மணி நேரம் முளைகட்டி காயவைக்கவும்.', 'வறுவல்: தானியங்கள், சுக்கு, ஏலக்காயை மிதமான தீயில் வறுக்கவும்.', 'அரைத்தல்: மெஷினில் கொடுத்து நைஸாக அரைத்து சலிக்கவும்.', 'கலத்தல்: அஸ்வகந்தா, அதிமதுரம், துளசி, நாட்டுச் சர்க்கரை சேர்த்து நன்றாகக் கலக்கவும்.', 'பேக்கிங்: 200 கிராம் ஜிப்லாக் பவுச்சுகளில் அடைத்து சீல் செய்யவும்.'] },
          { id: 7, name: 'Traditional Bath Powder (Nalangu Mavu)', nameTa: 'நலங்கு மாவு', category: 'Wellness', details: 'Kasturi Manjal (20%), Avarampoo (15%), Poolankizhangu (15%), Korai Kizhangu (10%), Roja Idhazh (10%), Green Gram Flour (15%), Vettiver (5%), Magizham Poo (5%), Vasambu (5%)', detailsTa: 'கஸ்தூரி மஞ்சள் (20%), ஆவாரம்பூ (15%), பூலாங்கிழங்கு (15%), கோரைக் கிழங்கு (10%), காய்ந்த ரோஜா இதழ்கள் (10%), பாசிப்பயிறு (15%), வெட்டிவேர் (5%), மகிழம்பூ (5%), வசம்பு (5%)', baseRatios: [{name: 'Kasturi Manjal (Wild Turmeric)', nameTa: 'கஸ்தூரி மஞ்சள்', ratio: 0.20}, {name: 'Avarampoo (Tanner\'s Cassia)', nameTa: 'ஆவாரம்பூ', ratio: 0.15}, {name: 'Poolankizhangu (White Turmeric)', nameTa: 'பூலாங்கிழங்கு', ratio: 0.15}, {name: 'Korai Kizhangu (Cyperus Rotundus)', nameTa: 'கோரைக் கிழங்கு', ratio: 0.10}, {name: 'Roja Idhazh (Dried Rose Petals)', nameTa: 'காய்ந்த ரோஜா இதழ்கள்', ratio: 0.10}, {name: 'Green Gram Flour (Pasai Payiru)', nameTa: 'பாசிப்பயிறு', ratio: 0.15}, {name: 'Vettiver (Khuskhus Grass)', nameTa: 'வெட்டிவேர்', ratio: 0.05}, {name: 'Magizham Poo', nameTa: 'மகிழம்பூ', ratio: 0.05}, {name: 'Vasambu (Sweet Flag)', nameTa: 'வசம்பு', ratio: 0.05}],
            steps: ['Drying Inspection: Ensure all 9 herbs are sun-dried below 4% moisture content.', 'Coarse Chopping: Break Vettiver grass, Vasambu, and Korai Kizhangu into smaller pieces before grinding.', 'Pulverization: Grind all ingredients in a heavy-duty pulverizer mill.', 'Fine Sifting: Pass powder through a #80 mesh stainless steel sieve to achieve a soft skin-friendly texture.', 'Packaging: Pack into 100g moisture-barrier kraft pouches and heat-seal.'],
            stepsTa: ['உலர்த்துதல்: 9 வகை மூலிகைகளும் நன்றாகக் காய்ந்துள்ளதை உறுதி செய்யவும்.', 'வெட்டுதல்: வெட்டிவேர், வசம்பு, கோரைக் கிழங்கைச் சிறிய துண்டுகளாக நறுக்கவும்.', 'அரைத்தல் & சலித்தல்: மிஷினில் அரைத்து #80 மெஷ் சல்லடையில் நைஸாக சலிக்கவும்.', 'பேக்கிங்: 100 கிராம் ஈரம் புகாத பாக்கெட்டுகளில் அடைத்து சீல் செய்யவும்.'] },

          // ==================== HAIR CARE RANGE (SKU-008 to 014) ====================
          { id: 101, name: 'Traditional Hair Wash Powder (Shikakai)', nameTa: 'சிகைக்காய் பொடி', category: 'Hair Care', details: 'Shikakai Pods (35%), Soapnut (20%), Pasai Payiru (15%), Avarampoo (10%), Sembaruthi (10%), Kariveppilai (5%), Vettiver (3%), Fenugreek (2%)', detailsTa: 'சிகைக்காய் (35%), பூந்திகொட்டை (20%), பாசிப்பயிறு (15%), ஆவாரம்பூ (10%), செம்பருத்தி பூ & இலை (10%), கருவேப்பிலை (5%), வெட்டிவேர் (3%), வெந்தயம் (2%)', baseRatios: [{name: 'Shikakai Pods', nameTa: 'சிகைக்காய்', ratio: 0.35}, {name: 'Soapnut (Poonthan Kottai)', nameTa: 'பூந்திகொட்டை', ratio: 0.20}, {name: 'Pasai Payiru (Green Gram)', nameTa: 'பாசிப்பயிறு', ratio: 0.15}, {name: 'Avarampoo (Tanner\'s Cassia)', nameTa: 'ஆவாரம்பூ', ratio: 0.10}, {name: 'Sembaruthi (Hibiscus Flower & Leaves)', nameTa: 'செம்பருத்தி பூ & இலை', ratio: 0.10}, {name: 'Kariveppilai (Curry Leaves)', nameTa: 'கருவேப்பிலை', ratio: 0.05}, {name: 'Vettiver (Khuskhus Grass)', nameTa: 'வெட்டிவேர்', ratio: 0.03}, {name: 'Fenugreek (Vendhayam)', nameTa: 'வெந்தயம்', ratio: 0.02}],
            steps: ['Inspection & Pre-Treatment: Clean all raw herbs. Remove seeds from soapnuts (use outer shell only).', 'Sun-Drying: Sun-dry Shikakai pods, soapnuts, hibiscus, and curry leaves for 8 to 10 hours until crisp (moisture < 4%).', 'Coarse Chopping: Cut Vettiver and tough Shikakai pods into smaller pieces to prevent mill jamming.', 'Pulverization & Sifting: Pulverize all ingredients in a commercial heavy-duty mill. Pass through a #80 mesh stainless steel sieve.', 'Homogenization & Packaging: Blend the sifted powder in a stainless steel mixer for 10 minutes to ensure even distribution. Pack into 100g moisture-proof kraft pouches and heat-seal.'],
            stepsTa: ['பரிசோதனை: சிகைக்காய் மற்றும் மூலிகைகளைச் சுத்தம் செய்யவும். பூந்திகொட்டையின் உள்ளே இருக்கும் கருப்பு விதைகளை நீக்கவும்.', 'வெயிலில் உலர்த்துதல்: சிகைக்காய், பூந்திகொட்டை, செம்பருத்தி மற்றும் கருவேப்பிலையை 8-10 மணி நேரம் நைஸாகக் காயவைக்கவும்.', 'துண்டாக்குதல்: வெட்டிவேர் மற்றும் சிகைக்காயைச் சிறிய துண்டுகளாக வெட்டவும்.', 'அரைத்தல் & சலித்தல்: மிஷினில் அரைத்து #80 மெஷ் சல்லடையில் சலித்தெடுக்கவும்.', 'பேக்கிங்: 10 நிமிடங்கள் கலவையில் கலந்து, 100 கிராம் ஈரம் புகாத பவுச்சுகளில் அடைத்து சீல் செய்யவும்.'] },
          { id: 102, name: 'Herbal Hair Growth Oil', nameTa: 'மூலிகை கூந்தல் தைலம்', category: 'Hair Care', details: 'Cold-Pressed Coconut Oil (70%), Sesame Oil (15%), Castor Oil (5%), Karisalanganni Juice (4%), Amla Juice (3%), Bhringraj & Neem Leaf Paste (2%), Vetiver Root (1%)', detailsTa: 'மரச்செக்கு தேங்காய் எண்ணெய் (70%), நல்லெண்ணெய் (15%), விளக்கெண்ணெய் (5%), கரிசலாங்கண்ணி சாறு (4%), நெல்லிக்காய் சாறு (3%), பிருங்கராஜ் & வேம்பு விழுது (2%), வெட்டிவேர் (1%)', baseRatios: [{name: 'Cold-Pressed Coconut Oil', nameTa: 'மரச்செக்கு தேங்காய் எண்ணெய்', ratio: 0.70}, {name: 'Cold-Pressed Sesame (Till) Oil', nameTa: 'நல்லெண்ணெய்', ratio: 0.15}, {name: 'Cold-Pressed Castor Oil', nameTa: 'விளக்கெண்ணெய்', ratio: 0.05}, {name: 'Karisalanganni Juice (False Daisy)', nameTa: 'கரிசலாங்கண்ணி சாறு', ratio: 0.04}, {name: 'Amla Juice (Fresh Gooseberry)', nameTa: 'நெல்லிக்காய் சாறு', ratio: 0.03}, {name: 'Bhringraj & Neem Leaf Paste', nameTa: 'பிருங்கராஜ் & வேம்பு விழுது', ratio: 0.02}, {name: 'Vetiver Root', nameTa: 'வெட்டிவேர்', ratio: 0.01}],
            steps: ['Juice Extraction: Grind fresh Karisalanganni leaves and Amla without adding extra water; strain through muslin cloth.', 'Oil Blending: Mix Coconut oil, Sesame oil, and Castor oil in a heavy-bottomed brass or copper vessel.', 'Traditional Slow Cooking (Kashayam Method): Add herbal juices and paste to the oil mixture. Heat on low flame for 3 to 4 hours until all water content evaporates and the oil stops crackling.', 'Herbal Sediment Filtration: Filter warm oil through a 4-layer sterile muslin cloth into a settling tank.', 'Bottling: Add 1 piece of fresh Vetiver root inside each sterile 100ml flip-top PET/glass bottle, fill with clarified herbal oil, cap, and seal.'],
            stepsTa: ['சாறு எடுத்தல்: புதிய கரிசலாங்கண்ணி இலை மற்றும் நெல்லிக்காயை தண்ணீர் சேர்க்காமல் அரைத்து துணியில் பிழிந்து சாறெடுக்கவும்.', 'எண்ணெய் கலத்தல்: தேங்காய் எண்ணெய், நல்லெண்ணெய், விளக்கெண்ணெயை பித்தளை பாத்திரத்தில் ஊற்றவும்.', 'காய்ச்சுதல்: மூலிகை சாறு மற்றும் விழுதைச் சேர்த்து மிதமான தீயில் 3-4 மணி நேரம் கொதிக்க வைக்கவும். நுரை அடங்கி நீர்ச்சத்து முற்றிலும் வற்றும் வரை காய்ச்சவும்.', 'வடிகட்டுதல்: மெல்லிய பருத்தித் துணியில் எண்ணெயை வடிகட்டவும்.', 'பாட்டில் அடைப்பு: 100 மிலி பாட்டிலின் உள்ளே சிறிய வெட்டிவேர் துண்டைப்போட்டு, எண்ணெயை ஊற்றி மூடவும்.'] },
          { id: 103, name: 'Hibiscus & Bhringraj Hair Cleanser', nameTa: 'செம்பருத்தி பிருங்கராஜ் ஹேர் வாஷ்', category: 'Hair Care', details: 'Purified Water/Herbal Decoction (50%), Coco Glucoside (25%), Hibiscus Extract (10%), Bhringraj Extract (8%), Vegetable Glycerin (4%), Rosemary EO (2%), Preservative (1%)', detailsTa: 'மூலிகை சாறு நீர் (50%), இயற்கையான நுரை காரணி (25%), செம்பருத்தி சாறு (10%), பிருங்கராஜ் சாறு (8%), வெஜிடபிள் கிளிசரின் (4%), ரோஸ்மேரி ஆயில் (2%), இயற்கை பாதுகாப்பு காரணி (1%)', baseRatios: [{name: 'Purified Water / Herbal Decoction', nameTa: 'மூலிகை சாறு நீர்', ratio: 0.50}, {name: 'Plant-Based Liquid Base (Coco Glucoside)', nameTa: 'இயற்கையான நுரை காரணி', ratio: 0.25}, {name: 'Fresh Hibiscus Extract', nameTa: 'செம்பருத்தி சாறு', ratio: 0.10}, {name: 'Bhringraj Liquid Extract', nameTa: 'பிருங்கராஜ் சாறு', ratio: 0.08}, {name: 'Vegetable Glycerin', nameTa: 'வெஜிடபிள் கிளிசரின்', ratio: 0.04}, {name: 'Rosemary Essential Oil', nameTa: 'ரோஸ்மேரி ஆயில்', ratio: 0.02}, {name: 'Natural Preservative', nameTa: 'இயற்கை பாதுகாப்பு காரணி', ratio: 0.01}],
            steps: ['Decoction Prep: Boil fresh Hibiscus petals and Bhringraj leaves in purified water for 20 minutes; cool and strain.', 'Base Mixing: In a stainless steel mixing vessel, combine Coco Glucoside and Vegetable Glycerin; stir slowly to avoid excess foaming.', 'Herbal Infusion: Slowly pour strained herbal decoction into the surfactant mixture while stirring continuously.', 'Actives & Fragrance: Add Rosemary essential oil and Eco-Cert natural preservative at room temperature (~35°C).', 'pH Check & Bottling: Measure pH (should be 5.5 to 6.0). Fill into 200ml pump dispenser bottles.'],
            stepsTa: ['கஷாயம் தயாரித்தல்: செம்பருத்தி பூக்கள் மற்றும் பிருங்கராஜ் இலையைத் தண்ணீரில் 20 நிமிடங்கள் கொதிக்க வைத்து வடிகட்டவும்.', 'பேஸ் கலத்தல்: கோகோ குளூக்கோசைடு மற்றும் கிளிசரினை பாத்திரத்தில் ஊற்றி மெதுவாகக் கலக்கவும்.', 'சாறு சேர்த்தல்: வடிகட்டிய மூலிகைச் சாறை கலவையுடன் மெதுவாகச் சேர்த்துக் கிளறவும்.', 'பாதுகாப்பு காரணி: ரோஸ்மேரி ஆயில் மற்றும் இயற்கை பிரசர்வேடிவ் சேர்க்கவும்.', 'பாட்டில் அடைப்பு: pH அளவு 5.5 - 6.0 இருப்பதை உறுதி செய்து 200 மிலி பம்ப் பாட்டில்களில் அடைக்கவும்.'] },
          { id: 104, name: 'Anti-Dandruff Herbal Hair Pack', nameTa: 'பொடுகு நீக்கும் மூலிகை ஹேர் பேக்', category: 'Hair Care', details: 'Neem Leaf Powder (25%), Tulsi Leaf Powder (20%), Fenugreek Seed Powder (20%), Kuppaimeni Powder (15%), Lemon Peel Powder (10%), Camphor Powder (5%), Tea Tree EO (5%)', detailsTa: 'வேப்பிலை பொடி (25%), துளசி பொடி (20%), வெந்தயப் பொடி (20%), குப்பைமேனி பொடி (15%), எலுமிச்சை தோல் பொடி (10%), பச்சை கற்பூரம் (5%), டீ ட்ரீ ஆயில் (5%)', baseRatios: [{name: 'Neem Leaf Powder (Vepillai)', nameTa: 'வேப்பிலை பொடி', ratio: 0.25}, {name: 'Tulsi Leaf Powder', nameTa: 'துளசி பொடி', ratio: 0.20}, {name: 'Fenugreek Seed Powder (Vendhayam)', nameTa: 'வெந்தயப் பொடி', ratio: 0.20}, {name: 'Kuppaimeni Powder', nameTa: 'குப்பைமேனி பொடி', ratio: 0.15}, {name: 'Lemon Peel Powder', nameTa: 'எலுமிச்சை தோல் பொடி', ratio: 0.10}, {name: 'Camphor Powder (Pachai Karpooram)', nameTa: 'பச்சை கற்பூரம்', ratio: 0.05}, {name: 'Tea Tree Essential Oil', nameTa: 'டீ ட்ரீ ஆயில்', ratio: 0.05}],
            steps: ['Drying & Quality Check: Ensure Neem, Tulsi, Kuppaimeni, and Lemon peel are completely sun-dried (< 4% moisture).', 'Pulverization: Grind all dry ingredients together in a high-speed commercial mill.', 'Fine Sifting: Pass the ground pack through a #100 mesh stainless steel sieve for ultra-smooth application.', 'Oil Drops Infusion: Sprinkle Tea Tree essential oil and finely crushed Pachai Karpooram over the powder. Mix thoroughly in a ribbon blender for 15 minutes.', 'Packaging: Pack into 100g aluminum foil zip-lock stand-up pouches immediately to preserve essential oils.'],
            stepsTa: ['உலர்த்துதல்: வேப்பிலை, துளசி, குப்பைமேனி மற்றும் எலுமிச்சை தோலை நன்றாகக் காயவைக்கவும்.', 'அரைத்தல்: அனைத்து உலர் பொருட்களையும் மிஷினில் அரைத்துக் கொள்ளவும்.', 'சலித்தல்: #100 மெஷ் சல்லடையில் நைஸாக சலித்தெடுக்கவும்.', 'எண்ணெய் சேர்த்தல்: டீ ட்ரீ ஆயில் மற்றும் பச்சை கற்பூரத்தைச் சேர்த்து 15 நிமிடங்கள் நன்றாகக் கலக்கவும்.', 'பேக்கிங்: 100 கிராம் அலுமினியம் ஜிப்லாக் பவுச்சுகளில் அடைத்து சீல் செய்யவும்.'] },
          { id: 105, name: 'Indigo & Henna Natural Hair Dye', nameTa: 'அவுரி மருதாணி இயற்கை ஹேர் டை', category: 'Hair Care', details: 'Pure Indigo Leaf Powder (50%), Organic Henna Leaf Powder (35%), Amla Fruit Powder (8%), Bhingraj Powder (5%), Shikakai Powder (2%) — dual-pouch system', detailsTa: 'அவுரி இலை பொடி (50%), மருதாணி பொடி (35%), நெல்லிக்காய் பொடி (8%), பிருங்கராஜ் பொடி (5%), சிகைக்காய் பொடி (2%) — இரட்டை பவுச் அமைப்பு', baseRatios: [{name: 'Pure Indigo Leaf Powder (Avuri)', nameTa: 'அவுரி இலை பொடி', ratio: 0.50}, {name: 'Organic Henna Leaf Powder (Maruthani)', nameTa: 'மருதாணி பொடி', ratio: 0.35}, {name: 'Amla Fruit Powder (Nellikai)', nameTa: 'நெல்லிக்காய் பொடி', ratio: 0.08}, {name: 'Bhingraj Powder', nameTa: 'பிருங்கராஜ் பொடி', ratio: 0.05}, {name: 'Shikakai Powder', nameTa: 'சிகைக்காய் பொடி', ratio: 0.02}],
            steps: ['Raw Material Sourcing: Source 100% triple-sifted organic Henna and Indigo leaf powders.', 'Henna Base Blend: Mix Henna powder, Amla powder, Bhringraj powder, and Shikakai powder thoroughly.', 'Indigo Processing: Keep Indigo powder separate as a pure single component to preserve its dye release properties.', 'Triple Sifting: Sift both powder formulations through a #120 mesh sieve to ensure silky smooth dye paste when mixed with water.', 'Dual Pouch Packaging: Pack Henna Mix (Step 1 Pouch) and Indigo Powder (Step 2 Pouch) into separate sealed foil pouches and enclose inside a printed carton box with gloves and applicator brush.'],
            stepsTa: ['பொருட்கள் ஆய்வு: 100% ஆர்கானிக் மருதாணி மற்றும் அவுரி இலை பொடிகளைச் சரிபார்க்கவும்.', 'ஹேனா கலவை: மருதாணி பொடி, நெல்லிக்காய், பிருங்கராஜ் மற்றும் சிகைக்காய் பொடியை ஒன்றாகக் கலக்கவும்.', 'அவுரி தயாரிப்பு: அவுரி பொடியைத் தனியாக வைக்கவும் (இதனைச் சேர்க்கக் கூடாது).', 'சலித்தல்: #120 மெஷ் சல்லடையில் நைஸாக சலித்தெடுக்கவும்.', 'பேக்கிங்: மருதாணி கலவை (ஸ்டெப் 1) மற்றும் அவுரி பொடி (ஸ்டெப் 2) என தனித்தனி பவுச்சுகளில் அடைத்து பாக்ஸில் வைக்கவும்.'] },
          { id: 106, name: 'Aloe Vera & Rosemary Hair Tonic', nameTa: 'கற்றாழை ரோஸ்மேரி ஹேர் டானிக்', category: 'Hair Care', details: 'Pure Aloe Vera Gel/Juice (60%), Rosemary Hydrosol (30%), Rosemary EO (3%), Vegetable Glycerin (4%), Solubilizer (2%), Eco Preservative (1%)', detailsTa: 'சோற்றுக் கற்றாழை சாறு (60%), ரோஸ்மேரி ஹைட்ரோசால் (30%), ரோஸ்மேரி எசென்ஷியல் ஆயில் (3%), கிளிசரின் (4%), ஆயில் கரைப்பான் (2%), இயற்கை பிரசர்வேடிவ் (1%)', baseRatios: [{name: 'Pure Aloe Vera Inner Leaf Gel/Juice', nameTa: 'சோற்றுக் கற்றாழை சாறு', ratio: 0.60}, {name: 'Rosemary Floral Water / Hydrosol', nameTa: 'ரோஸ்மேரி ஹைட்ரோசால்', ratio: 0.30}, {name: 'Rosemary Essential Oil', nameTa: 'ரோஸ்மேரி எசென்ஷியல் ஆயில்', ratio: 0.03}, {name: 'Vegetable Glycerin', nameTa: 'கிளிசரின்', ratio: 0.04}, {name: 'Solubilizer (Polysorbate 20 / Natural)', nameTa: 'ஆயில் கரைப்பான்', ratio: 0.02}, {name: 'Eco Preservative', nameTa: 'இயற்கை பிரசர்வேடிவ்', ratio: 0.01}],
            steps: ['Gel Extraction & Filtermash: Scoop fresh Aloe Vera gel, wash aloin yellow sap thoroughly, blend, and strain through a fine mesh filter.', 'Hydrosol Blending: Combine Aloe Vera juice with Rosemary hydrosol and Vegetable Glycerin in a stainless steel vessel.', 'Oil Solubilization: Mix Rosemary essential oil with Polysorbate 20 in a separate beaker until completely clear.', 'Final Mixture: Slowly pour the solubilized oil mixture into the water phase while stirring continuously. Add eco-preservative.', 'Quality Check & Filling: Check clarity and pH (5.0 to 5.5). Fill into 100ml amber PET bottles equipped with fine-mist spray pumps.'],
            stepsTa: ['கற்றாழை சாறு: கற்றாழை ஜெல்லை மஞ்சள் திரவம் போகக் கழுவி, அரைத்து வடிகட்டவும்.', 'ஹைட்ரோசால் கலத்தல்: கற்றாழை சாறு, ரோஸ்மேரி வாட்டர் மற்றும் கிளிசரினைக் கலக்கவும்.', 'எண்ணெய் கரைத்தல்: ரோஸ்மேரி ஆயில் மற்றும் சால்பிலைசரை தனியாகக் கலந்து கொள்ளவும்.', 'ஒன்றாகக் கலத்தல்: எண்ணெய் கலவையை நீரடிப்படை கலவையுடன் சேர்த்து பிரசர்வேடிவ் சேர்க்கவும்.', 'பேக்கிங்: pH அளவு 5.0 - 5.5 சரிபார்த்து 100 மிலி ஸ்ப்ரே பாட்டில்களில் ஊற்றவும்.'] },
          { id: 107, name: 'Cold-Pressed Coconut Hair Oil', nameTa: 'செக்கு தேங்காய் எண்ணெய்', category: 'Hair Care', details: 'Cold-Pressed Virgin Coconut Oil (98%), Dried Jasmine & Rose Petals (1%), Natural Vitamin E Oil (1%)', detailsTa: 'மரச்செக்கு தேங்காய் எண்ணெய் (98%), காய வைத்த மல்லிகை & ரோஜா (1%), வைட்டமின் ஈ ஆயில் (1%)', baseRatios: [{name: 'Cold-Pressed Virgin Coconut Oil', nameTa: 'மரச்செக்கு தேங்காய் எண்ணெய்', ratio: 0.98}, {name: 'Dried Jasmine & Rose Petals', nameTa: 'காய வைத்த மல்லிகை & ரோஜா', ratio: 0.01}, {name: 'Natural Vitamin E Oil', nameTa: 'வைட்டமின் ஈ ஆயில்', ratio: 0.01}],
            steps: ['Sourcing: Procure pure, unrefined cold-pressed coconut oil from sun-dried sulfur-free copra.', 'Moisture Settling: Allow raw cold-pressed oil to settle naturally in a stainless steel tank for 48 hours to deposit fine particles.', 'Micro Filtration: Filter cleared oil through a multi-stage cotton filter pad to yield crystal-clear coconut oil.', 'Antioxidant Fortification: Stir in Natural Vitamin E oil to extend shelf life and prevent rancidity.', 'Infusion & Bottling: Insert dried jasmine/rose petals into sterile 200ml bottles, pour filtered coconut oil, cap, and seal.'],
            stepsTa: ['எண்ணெய் தேர்வு: நல்ல கொப்பரைத் தேங்காயிலிருந்து ஆட்டப்பட்ட சுத்தமான செக்கு தேங்காய் எண்ணெயைப் பெறவும்.', 'படியவைத்தல்: எண்ணெயை 48 மணி நேரம் பாத்திரத்தில் படிய வைக்கவும்.', 'வடிகட்டுத்தல்: துணி வடிகட்டி மூலம் தெளிவான எண்ணெயை எடுக்கவும்.', 'வைட்டமின் ஈ சேர்க்கை: எண்ணெய் கெடாமல் இருக்க வைட்டமின் ஈ ஆயில் சேர்க்கவும்.', 'பேக்கிங்: உலர்ந்த பூக்களை பாட்டிலில் போட்டு, எண்ணெயை ஊற்றி 200 மிலி பாட்டில்களில் அடைக்கவும்.'] },

          // ==================== SKINCARE & BATHING (SKU-015 to 021) ====================
          { id: 201, name: 'Pure Goat Milk Soap', nameTa: 'ஆட்டுப்பால் சோப்', category: 'Skincare', details: 'Goat Milk Soap Base (88%), Coconut Oil (4%), Sweet Almond Oil (3%), Goat Milk Powder (2%), Natural Essential Oil (3%)', detailsTa: 'ஆட்டுப்பால் சோப் பேஸ் (88%), தேங்காய் எண்ணெய் (4%), பாதாம் எண்ணெய் (3%), ஆட்டுப்பால் பொடி (2%), இயற்கை வாசனை எண்ணெய் (3%)', baseRatios: [{name: 'Goat Milk Melt & Pour Soap Base', nameTa: 'ஆட்டுப்பால் சோப் பேஸ்', ratio: 0.88}, {name: 'Cold-Pressed Coconut Oil', nameTa: 'தேங்காய் எண்ணெய்', ratio: 0.04}, {name: 'Sweet Almond Oil', nameTa: 'பாதாம் எண்ணெய்', ratio: 0.03}, {name: 'Goat Milk Powder', nameTa: 'ஆட்டுப்பால் பொடி', ratio: 0.02}, {name: 'Natural Essential Oil (Lavender/Vanilla)', nameTa: 'இயற்கை வாசனை எண்ணெய்', ratio: 0.03}],
            steps: ['Dicing & Melting: Chop the Goat Milk soap base into 1-inch cubes. Heat in a clean double boiler until fully melted (temp ~60°C to 65°C). Avoid over-boiling.', 'Pre-mixing Actives: In a small beaker, paste Goat Milk powder with Sweet Almond oil and Coconut oil to ensure zero clumps.', 'Blending: Remove melted base from heat. Stir in the oil-milk powder paste thoroughly.', 'Fragrance Addition: Allow mixture to cool to 50°C. Add Essential Oil and gently stir for 1 minute.', 'Molding: Pour molten soap into 100g silicone bar molds. Spray surface with 70% isopropyl alcohol to pop air bubbles.', 'Setting & Packaging: Allow to harden at room temperature for 3 to 4 hours. Unmold, wrap in shrink film, and pack in monocarton boxes.'],
            stepsTa: ['நறுக்குதல் & உருக்குதல்: ஆட்டுப்பால் சோப் பேஸைச் சிறிய துண்டுகளாக நறுக்கி, டபுள் பாய்லரில் 60°C - 65°C வெப்பத்தில் உருக்கவும்.', 'கலவை தயாரிப்பு: பாதாம் மற்றும் தேங்காய் எண்ணெயுடன் ஆட்டுப்பால் பொடியைச் சேர்த்துக் கட்டியில்லாமல் கரைக்கவும்.', 'ஒன்றாகக் கலத்தல்: உருக்கிய பேஸை அடுப்பிலிருந்து இறக்கி, எண்ணெய்-பால் பொடி கலவையை ஊற்றிக் கலக்கவும்.', 'வாசனை எண்ணெய்: வெப்பநிலை 50°C-க்குக் குறைந்ததும் எசென்ஷியல் ஆயில் சேர்க்கவும்.', 'அச்சில் ஊற்றுதல்: சிலிகான் அச்சுகளில் ஊற்றி, குமிழிகளை அகற்ற ஆல்கஹால் ஸ்ப்ரே செய்யவும்.', 'பேக்கிங்: 3-4 மணி நேரம் ஆறவைத்து, அச்சிலிருந்து எடுத்து ஷ்ரிங்க் ஃபிலிம் சுற்றி பாக்ஸில் அடைக்கவும்.'] },
          { id: 202, name: 'Kasturi Manjal Skin Glow Soap', nameTa: 'கஸ்தூரி மஞ்சள் சோப்', category: 'Skincare', details: 'Goat Milk Soap Base (86%), Kasturi Manjal Powder (3%), Coconut Oil (5%), Sweet Almond Oil (4%), Sandalwood EO Blend (2%)', detailsTa: 'ஆட்டுப்பால் சோப் பேஸ் (86%), கஸ்தூரி மஞ்சள் பொடி (3%), தேங்காய் எண்ணெய் (5%), பாதாம் எண்ணெய் (4%), சந்தன வாசனை எண்ணெய் (2%)', baseRatios: [{name: 'Goat Milk Soap Base', nameTa: 'ஆட்டுப்பால் சோப் பேஸ்', ratio: 0.86}, {name: 'Kasturi Manjal Powder (Wild Turmeric)', nameTa: 'கஸ்தூரி மஞ்சள் பொடி', ratio: 0.03}, {name: 'Cold-Pressed Coconut Oil', nameTa: 'தேங்காய் எண்ணெய்', ratio: 0.05}, {name: 'Sweet Almond Oil', nameTa: 'பாதாம் எண்ணெய்', ratio: 0.04}, {name: 'Sandalwood Essential Oil Blend', nameTa: 'சந்தன வாசனை எண்ணெய்', ratio: 0.02}],
            steps: ['Base Preparation: Chop Goat Milk base and melt gently in a double boiler at 65°C.', 'Herb Slurry: Mix Kasturi Manjal powder with Coconut oil and Sweet Almond oil to form a smooth yellow slurry.', 'Incorporation: Pour the slurry into the melted base and whisk gently to achieve uniform golden color.', 'Cooling & Fragrance: Cool mixture to 50°C and stir in Sandalwood essential oil blend.', 'Pouring & Bubbles: Pour into 100g bar molds and spritz with isopropyl alcohol to remove surface froth.', 'Curing & Packing: Solidify for 3 hours, unmold, wrap in protective shrink wrap, and place into outer boxes.'],
            stepsTa: ['பேஸ் உருக்குதல்: சோப் பேஸை நறுக்கி டபுள் பாய்லரில் உருக்கவும்.', 'மஞ்சள் கரைசல்: கஸ்தூரி மஞ்சள் பொடியை தேங்காய் மற்றும் பாதாம் எண்ணெயுடன் சேர்த்து விழுதாகக் கலக்கவும்.', 'சோப் பேஸில் கலத்தல்: உருக்கிய பேஸில் மஞ்சள் விழுதை ஊற்றி பொன்னிறமாக வரும் வரை கலக்கவும்.', 'வாசனை சேர்க்கை: 50°C வெப்பநிலையில் சந்தன ஆயில் சேர்க்கவும்.', 'அச்சில் ஊற்றுதல்: அச்சுகளில் ஊற்றி ஆல்கஹால் ஸ்ப்ரே செய்து ஆறவிடவும்.', 'பேக்கிங்: 3 மணி நேரம் கழித்து அச்சிலிருந்து எடுத்து பேக் செய்யவும்.'] },
          { id: 203, name: 'Kuppaimeni Skin Healing Soap', nameTa: 'குப்பைமேனி சோப்', category: 'Skincare', details: 'Clear Glycerin Soap Base (87%), Kuppaimeni Extract/Powder (3%), Neem Oil (4%), Coconut Oil (4%), Tea Tree & Lavender EO (2%)', detailsTa: 'கிளிசரின் சோப் பேஸ் (87%), குப்பைமேனி சாறு/பொடி (3%), வேப்ப எண்ணெய் (4%), தேங்காய் எண்ணெய் (4%), டீ ட்ரீ & லேவெண்டர் ஆயில் (2%)', baseRatios: [{name: 'Clear Glycerin Soap Base', nameTa: 'கிளிசரின் சோப் பேஸ்', ratio: 0.87}, {name: 'Fresh Kuppaimeni Leaf Extract/Powder', nameTa: 'குப்பைமேனி சாறு/பொடி', ratio: 0.03}, {name: 'Cold-Pressed Neem Oil', nameTa: 'வேப்ப எண்ணெய்', ratio: 0.04}, {name: 'Cold-Pressed Coconut Oil', nameTa: 'தேங்காய் எண்ணெய்', ratio: 0.04}, {name: 'Tea Tree & Lavender Essential Oil', nameTa: 'டீ ட்ரீ & லேவெண்டர் ஆயில்', ratio: 0.02}],
            steps: ['Melting: Melt clear Glycerin soap base in a double boiler (~60°C).', 'Herbal-Oil Dispersal: Mix Kuppaimeni powder/extract with Neem oil and Coconut oil thoroughly.', 'Blending: Add the herbal oil mixture into the clear melted base. Stir steadily to distribute the natural green color evenly.', 'Essential Oils: Cool to 48°C. Stir in Tea Tree and Lavender essential oils.', 'Molding & De-bubbling: Pour into bar molds; spritz alcohol to clear bubbles.', 'Finishing: Cool completely for 3 hours, unmold, wrap in air-tight film, and box pack.'],
            stepsTa: ['உருக்குதல்: கிளிசரின் சோப் பேஸை டபுள் பாய்லரில் உருக்கவும்.', 'மூலிகை எண்ணெய் கலவை: குப்பைமேனி பொடியை வேப்ப எண்ணெய் மற்றும் தேங்காய் எண்ணெயுடன் கலக்கவும்.', 'சோப்பில் கலத்தல்: உருக்கிய பேஸில் மூலிகைக் கலவையைச் சேர்த்துக் கிளறவும்.', 'எசென்ஷியல் ஆயில்: 48°C வெப்பத்தில் டீ ட்ரீ மற்றும் லேவெண்டர் ஆயில் சேர்க்கவும்.', 'அச்சில் ஊற்றுதல்: அச்சுகளில் ஊற்றி ஆல்கஹால் ஸ்ப்ரே செய்யவும்.', 'பேக்கிங்: 3 மணி நேரம் கழித்து எடுத்து ஷ்ரிங்க் ஃபிலிம் சுற்றி பேக் செய்யவும்.'] },
          { id: 204, name: 'Red Sandalwood (Rakta Chandan) Soap', nameTa: 'ரத்த சந்தன சோப்', category: 'Skincare', details: 'Clear Glycerin Soap Base (86%), Red Sandalwood Powder (3%), Castor Oil (5%), Sweet Almond Oil (4%), Sandalwood EO (2%)', detailsTa: 'கிளிசரின் சோப் பேஸ் (86%), ரத்த சந்தன பொடி (3%), விளக்கெண்ணெய் (5%), பாதாம் எண்ணெய் (4%), சந்தன எசென்ஷியல் ஆயில் (2%)', baseRatios: [{name: 'Clear Glycerin Soap Base', nameTa: 'கிளிசரின் சோப் பேஸ்', ratio: 0.86}, {name: 'Red Sandalwood Powder (Rakta Chandan)', nameTa: 'ரத்த சந்தன பொடி', ratio: 0.03}, {name: 'Cold-Pressed Castor Oil', nameTa: 'விளக்கெண்ணெய்', ratio: 0.05}, {name: 'Sweet Almond Oil', nameTa: 'பாதாம் எண்ணெய்', ratio: 0.04}, {name: 'Natural Sandalwood Essential Oil', nameTa: 'சந்தன எசென்ஷியல் ஆயில்', ratio: 0.02}],
            steps: ['Base Prep: Melt transparent Glycerin soap base over a gentle double boiler.', 'Powder Suspension: Disperse fine Red Sandalwood powder into Castor oil and Almond oil to avoid clumping and sediment sinking.', 'Integration: Whisk the red herbal oil paste into the melted soap base until uniform deep-red color is achieved.', 'Scenting: Cool base to 50°C and stir in Sandalwood essential oil.', 'Molding: Pour into individual 100g silicone molds. Spray isopropyl alcohol immediately.', 'Packaging: Solidify for 3 hours. Unmold, wrap in moisture-proof cling film, and enclose in printed monocarton boxes.'],
            stepsTa: ['பேஸ் உருக்குதல்: கிளிசரின் சோப் பேஸை டபுள் பாய்லரில் உருக்கவும்.', 'ரத்த சந்தனம் கலத்தல்: ரத்த சந்தன பொடியை விளக்கெண்ணெய் மற்றும் பாதாம் எண்ணெயுடன் கட்டி இல்லாமல் கலக்கவும்.', 'ஒன்றாகக் கலத்தல்: உருக்கிய பேஸில் ரத்த சந்தனக் கலவையைச் சேர்த்து சிகப்பு நிறம் வரும் வரை கிளறவும்.', 'வாசனை எண்ணெய்: 50°C வெப்பத்தில் சந்தன ஆயில் சேர்க்கவும்.', 'அச்சில் ஊற்றுதல்: அச்சுகளில் ஊற்றி ஆல்கஹால் ஸ்ப்ரே செய்யவும்.', 'பேக்கிங்: 3 மணி நேரம் ஆறவைத்து, அச்சிலிருந்து எடுத்து பேக் செய்யவும்.'] },
          { id: 205, name: 'Avarampoo Golden Glow Soap', nameTa: 'ஆவாரம்பூ சோப்', category: 'Skincare', details: 'Goat Milk Soap Base (87%), Avarampoo Flower Powder (3%), Coconut Oil (5%), Sweet Almond Oil (3%), Ylang Ylang & Neroli EO (2%)', detailsTa: 'ஆட்டுப்பால் சோப் பேஸ் (87%), ஆவாரம்பூ பொடி (3%), தேங்காய் எண்ணெய் (5%), பாதாம் எண்ணெய் (3%), இலங்கு இலங்கு & நெரோலி ஆயில் (2%)', baseRatios: [{name: 'Goat Milk Soap Base', nameTa: 'ஆட்டுப்பால் சோப் பேஸ்', ratio: 0.87}, {name: 'Dried Avarampoo Flower Powder', nameTa: 'ஆவாரம்பூ பொடி', ratio: 0.03}, {name: 'Cold-Pressed Coconut Oil', nameTa: 'தேங்காய் எண்ணெய்', ratio: 0.05}, {name: 'Sweet Almond Oil', nameTa: 'பாதாம் எண்ணெய்', ratio: 0.03}, {name: 'Ylang Ylang & Neroli Essential Oil', nameTa: 'இலங்கு இலங்கு & நெரோலி ஆயில்', ratio: 0.02}],
            steps: ['Melting Base: Slice Goat Milk base into small chunks and melt over double boiler (~62°C).', 'Flower Paste: Blend ultra-fine Avarampoo powder with Coconut and Almond oils.', 'Mixing: Incorporate flower oil slurry into melted base, stirring continuously for smooth golden tint.', 'Aroma Addition: Cool batch to 48°C. Add Ylang Ylang and Neroli essential oil blend.', 'Molding & Air Bubble Removal: Pour into 100g rectangular silicone molds. Spray surface with isopropyl alcohol.', 'Packing: Cool completely for 3 to 4 hours. Unmold, wrap in shrink film, and insert into outer cartons.'],
            stepsTa: ['பேஸ் உருக்குதல்: ஆட்டுப்பால் சோப் பேஸை டபுள் பாய்லரில் வைத்து உருக்கவும்.', 'பூ பொடி கலவை: ஆவாரம்பூ பொடியை தேங்காய் மற்றும் பாதாம் எண்ணெயுடன் சேர்க்கவும்.', 'சோப்பில் கலத்தல்: உருக்கிய பேஸில் ஆவாரம்பூ கலவையை ஊற்றி மஞ்சள் நிறம் வரும் வரை கிளறவும்.', 'எசென்ஷியல் ஆயில்: 48°C வெப்பத்தில் வாசனை எண்ணெய் சேர்க்கவும்.', 'அச்சில் ஊற்றுதல்: அச்சுகளில் ஊற்றி ஆல்கஹால் ஸ்ப்ரே செய்து நுரையை அகற்றவும்.', 'பேக்கிங்: 3-4 மணி நேரம் ஆறவைத்து, அச்சிலிருந்து எடுத்து பாக்ஸில் பேக் செய்யவும்.'] },
          { id: 206, name: 'Activated Charcoal Detox Soap', nameTa: 'சார்கோல் சோப்', category: 'Skincare', details: 'Clear Glycerin Soap Base (87%), Activated Bamboo Charcoal Powder (2%), Coconut Oil (5%), Castor Oil (4%), Tea Tree & Peppermint EO (2%)', detailsTa: 'கிளிசரின் சோப் பேஸ் (87%), சார்கோல் பொடி (2%), தேங்காய் எண்ணெய் (5%), விளக்கெண்ணெய் (4%), டீ ட்ரீ & புதினா ஆயில் (2%)', baseRatios: [{name: 'Clear Glycerin Soap Base', nameTa: 'கிளிசரின் சோப் பேஸ்', ratio: 0.87}, {name: 'Activated Bamboo Charcoal Powder', nameTa: 'சார்கோல் பொடி', ratio: 0.02}, {name: 'Cold-Pressed Coconut Oil', nameTa: 'தேங்காய் எண்ணெய்', ratio: 0.05}, {name: 'Cold-Pressed Castor Oil', nameTa: 'விளக்கெண்ணெய்', ratio: 0.04}, {name: 'Tea Tree & Peppermint Essential Oil', nameTa: 'டீ ட்ரீ & புதினா ஆயில்', ratio: 0.02}],
            steps: ['Melting: Melt clear Glycerin soap base over a low double boiler.', 'Charcoal Slurry: Mix fine Activated Bamboo Charcoal powder into Coconut and Castor oil to create a streak-free black liquid.', 'Combining: Pour charcoal slurry into melted soap base. Whisk thoroughly until solid jet-black appearance is achieved.', 'Cooling & Scent: Cool to 50°C. Add Tea Tree and Peppermint essential oils; stir gently.', 'Molding: Pour into molds; spritz alcohol spray to pop top air bubbles.', 'Setting & Packing: Allow to set for 3 hours. Unmold, wrap tightly in cling film, and box pack.'],
            stepsTa: ['பேஸ் உருக்குதல்: கிளிசரின் சோப் பேஸை டபுள் பாய்லரில் உருக்கவும்.', 'சார்கோல் கரைசல்: சார்கோல் பொடியை தேங்காய் மற்றும் விளக்கெண்ணெயுடன் கட்டியில்லாமல் கலக்கவும்.', 'சோப்பில் கலத்தல்: உருக்கிய பேஸில் சார்கோல் கலவையை ஊற்றி கருப்பு நிறம் வரும் வரை நன்றாகக் கலக்கவும்.', 'எசென்ஷியல் ஆயில்: 50°C வெப்பநிலையில் டீ ட்ரீ மற்றும் புதினா ஆயில் சேர்க்கவும்.', 'அச்சில் ஊற்றுதல்: அச்சுகளில் ஊற்றி ஆல்கஹால் ஸ்ப்ரே செய்யவும்.', 'பேக்கிங்: 3 மணி நேரம் கழித்து அச்சிலிருந்து எடுத்து ஃபிலிம் சுற்றி பேக் செய்யவும்.'] },
          { id: 207, name: 'Neem & Tulsi Anti-Acne Soap', nameTa: 'வேம்பு துளசி சோப்', category: 'Skincare', details: 'Clear Glycerin Soap Base (87%), Neem & Tulsi Powder Extract (3%), Neem Oil (4%), Coconut Oil (4%), Spearmint & Eucalyptus EO (2%)', detailsTa: 'கிளிசரின் சோப் பேஸ் (87%), வேம்பு & துளசி பொடி (3%), வேப்ப எண்ணெய் (4%), தேங்காய் எண்ணெய் (4%), புதினா & யூகலிப்டஸ் ஆயில் (2%)', baseRatios: [{name: 'Clear Glycerin Soap Base', nameTa: 'கிளிசரின் சோப் பேஸ்', ratio: 0.87}, {name: 'Dried Neem & Tulsi Powder Extract', nameTa: 'வேம்பு & துளசி பொடி', ratio: 0.03}, {name: 'Cold-Pressed Neem Oil', nameTa: 'வேப்ப எண்ணெய்', ratio: 0.04}, {name: 'Cold-Pressed Coconut Oil', nameTa: 'தேங்காய் எண்ணெய்', ratio: 0.04}, {name: 'Spearmint & Eucalyptus Essential Oil', nameTa: 'புதினா & யூகலிப்டஸ் ஆயில்', ratio: 0.02}],
            steps: ['Melting: Slice clear Glycerin base into cubes and melt over a double boiler at 60°C.', 'Herbal Pre-mix: Whisk Neem and Tulsi powder with Neem oil and Coconut oil.', 'Integration: Stir the herbal paste into the molten clear base until a rich herbal-green color spreads evenly.', 'Scenting: Cool base to 48°C. Stir in Spearmint and Eucalyptus essential oils.', 'Molding: Pour into 100g silicone molds and mist with isopropyl alcohol.', 'Curing & Packing: Solidify for 3 hours, unmold, wrap in air-tight shrink film, and enclose in individual boxes.'],
            stepsTa: ['பேஸ் உருக்குதல்: கிளிசரின் சோப் பேஸை நறுக்கி டபுள் பாய்லரில் 60°C-யில் உருக்கவும்.', 'மூலிகை கரைசல்: வேம்பு மற்றும் துளசி பொடியை வேப்ப எண்ணெய், தேங்காய் எண்ணெயுடன் கலக்கவும்.', 'சோப்பில் கலத்தல்: உருக்கிய பேஸில் மூலிகைக் கலவையைச் சேர்த்து பச்சை நிறம் வரும் வரை கலக்கவும்.', 'வாசனை எண்ணெய்: 48°C வெப்பத்தில் புதினா மற்றும் யூகலிப்டஸ் ஆயில் சேர்க்கவும்.', 'அச்சில் ஊற்றுதல்: அச்சுகளில் ஊற்றி ஆல்கஹால் ஸ்ப்ரே செய்யவும்.', 'பேக்கிங்: 3 மணி நேரம் ஆறவைத்து அச்சிலிருந்து எடுத்து பேக் செய்யவும்.'] },

          { id: 301, name: 'Herbal Dish Wash Powder', nameTa: 'மூலிகை பாத்திரம் கழுவும் பொடி', category: 'Household', details: 'Soapnut Shell Powder (45%), Shikakai Pod Powder (23%), Channa Dal/Gram Flour (23%), Lemon Peel Powder (5%), Wood Ash (4%)', detailsTa: 'பூந்திகொட்டை பொடி (45%), சிகைக்காய் பொடி (23%), கடலைப்பருப்பு மாவு (23%), எலுமிச்சை தோல் பொடி (5%), மரச்சாம்பல் (4%)', baseRatios: [{name: 'Soapnut Shell Powder (Deseeded)', nameTa: 'பூந்திகொட்டை பொடி', ratio: 0.45}, {name: 'Shikakai Pod Powder', nameTa: 'சிகைக்காய் பொடி', ratio: 0.23}, {name: 'Channa Dal / Gram Flour', nameTa: 'கடலைப்பருப்பு மாவு', ratio: 0.23}, {name: 'Dehydrated Lemon Peel Powder', nameTa: 'எலுமிச்சை தோல் பொடி', ratio: 0.05}, {name: 'Wood Ash / Rice Husk Ash', nameTa: 'மரச்சாம்பல் / உமி சாம்பல்', ratio: 0.04}],
            steps: ['Drying & Cleaning: Ensure Soapnut shells (deseeded), Shikakai, and Lemon peels are completely sun-dried (< 4% moisture).', 'Coarse Pulverization: Pass Soapnut and Shikakai through a commercial pulverizer to form a coarse meal.', 'Fine Milling: Combine with Channa Dal flour, Lemon peel powder, and Wood ash. Mill through a #80 mesh stainless steel sieve.', 'Homogenization: Blend all dry ingredients in a ribbon blender for 15 minutes to ensure uniform cleaning capability.', 'Packaging: Pack into moisture-proof 50g / 250g / 500g stand-up pouches or containers and heat-seal.'],
            stepsTa: ['உலர்த்துதல்: பூந்திகொட்டை (விதை நீக்கியது), சிகைக்காய் மற்றும் எலுமிச்சை தோலை நன்றாகக் காயவைக்கவும்.', 'முதல் அரைப்பு: பூந்திகொட்டை மற்றும் சிகைக்காயை மிஷினில் கொடுத்து கொரகொரப்பாக அரைக்கவும்.', 'சலித்தல்: கடலைப்பருப்பு மாவு, எலுமிச்சை பொடி மற்றும் மரச்சாம்பல் சேர்த்து #80 மெஷ் சல்லடையில் நைஸாக சலிக்கவும்.', 'கலத்தல்: கலவை எந்திரத்தில் 15 நிமிடங்கள் நன்றாகக் கலக்கவும்.', 'பேக்கிங்: ஈரம் புகாத 250g / 500g பவுச்சுகளில் அடைத்து சீல் செய்யவும்.'] },
          { id: 302, name: 'Bio-Enzyme Multi-Purpose Cleaner', nameTa: 'பயோ-என்சைம் கிளீனர்', category: 'Household', details: 'Citrus Peel Ferment Extract (60%), Purified Water (30%), Jaggery Ferment Base (5%), Soapnut Liquid Extract (4%), Essential Oils (1%)', detailsTa: 'எலுமிச்சை/ஆரஞ்சு பயோ-என்சைம் (60%), சுத்திகரிக்கப்பட்ட நீர் (30%), கருப்பட்டி / வெல்லம் (5%), பூந்திகொட்டை சாறு (4%), யூகலிப்டஸ் / எலுமிச்சம்புல் ஆயில் (1%)', baseRatios: [{name: 'Citrus Peel Ferment Extract (Bioenzyme)', nameTa: 'எலுமிச்சை/ஆரஞ்சு பயோ-என்சைம்', ratio: 0.60}, {name: 'Purified Water', nameTa: 'சுத்திகரிக்கப்பட்ட நீர்', ratio: 0.30}, {name: 'Jaggery / Black Treacle Ferment Base', nameTa: 'கருப்பட்டி / வெல்லம்', ratio: 0.05}, {name: 'Soapnut Liquid Extract', nameTa: 'பூந்திகொட்டை சாறு', ratio: 0.04}, {name: 'Essential Oils (Eucalyptus/Lemongrass)', nameTa: 'யூகலிப்டஸ் / எலுமிச்சம்புல் ஆயில்', ratio: 0.01}],
            steps: ['Fermentation Phase (90 Days): Mix fresh citrus peels, jaggery, and water in a 1:3:10 ratio in an airtight food-grade drum. Ferment for 90 days, releasing gas daily for the first month.', 'Filtration: Strain fermented liquid through a multi-stage micron filter to obtain clear amber bio-enzyme.', 'Fortification: Add Soapnut liquid extract to enhance natural lathering and degreasing properties.', 'Fragrance Addition: Stir in Eucalyptus or Lemongrass essential oil for fresh aroma and antimicrobial boost.', 'Quality Control & Bottling: Measure pH (should be 3.0 to 4.0). Fill into 500ml PET bottles with spray nozzles.'],
            stepsTa: ['நொதித்தல் (90 நாட்கள்): எலுமிச்சை தோல், வெல்லம் மற்றும் தண்ணீரை 1:3:10 என்ற விகிதத்தில் பேரலில் 90 நாட்கள் ஊறவைத்து பயோ-என்சைம் தயாரிக்கவும்.', 'வடிகட்டுதல்: தெளிவான என்சைம் திரவத்தை மைக்ரான் ஃபில்டர் மூலம் வடிகட்டவும்.', 'நுரை காரணி: இயற்கை நுரை மற்றும் அழுக்கு நீக்க பூந்திகொட்டை சாறைச் சேர்க்கவும்.', 'வாசனை எண்ணெய்: நறுமணத்திற்கு எலுமிச்சம்புல் அல்லது யூகலிப்டஸ் ஆயில் சேர்க்கவும்.', 'பேக்கிங்: pH அளவு 3.0 - 4.0 இருப்பதை உறுதி செய்து 500 மிலி ஸ்ப்ரே பாட்டில்களில் அடைக்கவும்.'] },
          { id: 303, name: 'Natural Floor Cleaner', nameTa: 'இயற்கை தரை சுத்திகரிப்பு திரவம்', category: 'Household', details: 'Pine Oil Base Emulsion (30%), Citrus Bio-Enzyme Concentrate (30%), Soapnut Decoction (20%), Purified Water (15%), Camphor & Lemongrass EO (5%)', detailsTa: 'பைன் ஆயில் பேஸ் (30%), எலுமிச்சை பயோ-என்சைம் (30%), பூந்திகொட்டை கஷாயம் (20%), சுத்திகரிக்கப்பட்ட நீர் (15%), கற்பூரம் & எலுமிச்சம்புல் ஆயில் (5%)', baseRatios: [{name: 'Pine Oil Base Emulsion', nameTa: 'பைன் ஆயில் பேஸ்', ratio: 0.30}, {name: 'Citrus Bio-Enzyme Concentrate', nameTa: 'எலுமிச்சை பயோ-என்சைம்', ratio: 0.30}, {name: 'Soapnut Decoction Base', nameTa: 'பூந்திகொட்டை கஷாயம்', ratio: 0.20}, {name: 'Purified Water', nameTa: 'சுத்திகரிக்கப்பட்ட நீர்', ratio: 0.15}, {name: 'Camphor & Lemongrass Essential Oil Blend', nameTa: 'கற்பூரம் & எலுமிச்சம்புல் ஆயில்', ratio: 0.05}],
            steps: ['Emulsification: Blend Pine oil base with emulsifier until a milky white concentrate forms.', 'Herbal & Enzyme Integration: Gradually mix Citrus Bio-Enzyme, Soapnut decoction, and Purified water into the pine concentrate while stirring continuously.', 'Fly & Bug Repellent Fortification: Dissolve powdered Pachai Karpooram (Camphor) into Lemongrass oil and stir into the liquid solution.', 'Stability Check: Ensure no oil separation or layer formation occurs after standing for 2 hours.', 'Bottling: Fill into 1 Litre leak-proof handles/bottles and seal tightly.'],
            stepsTa: ['எமல்சிஃபிகேஷன்: பைன் ஆயிலை பாலாடை போன்று வெள்ளை திரவமாக மாற்றும் வரை கலக்கவும்.', 'என்சைம் கலத்தல்: எலுமிச்சை பயோ-என்சைம், பூந்திகொட்டை கஷாயம் மற்றும் தண்ணீரைச் சேர்த்துக் கிளறவும்.', 'பூச்சி விரட்டி சேர்க்கை: கற்பூரத்தைப் பொடித்து எலுமிச்சம்புல் ஆயிலில் கரைத்துத் திரவத்தில் சேர்க்கவும்.', 'பரிசோதனை: 2 மணி நேரம் வைத்து எண்ணெய் தனியாகப் பிரியாமல் உள்ளதா எனச் சரிபார்க்கவும்.', 'பேக்கிங்: 1 லிட்டர் பாட்டில்களில் ஊற்றி கசிவு இல்லாமல் சீல் செய்யவும்.'] },
          { id: 304, name: 'Eco Laundry Powder / Liquid', nameTa: 'இயற்கை துணி துவைக்கும் பொடி', category: 'Household', details: 'Deseeded Soapnut Powder (40%), Washing Soda (30%), Baking Soda (15%), Coarse Rock Salt (10%), Lemon EO (5%)', detailsTa: 'பூந்திகொட்டை பொடி (40%), வாஷிங் சோடா (30%), பேக்கிங் சோடா (15%), கல் உப்பு பொடி (10%), எலுமிச்சை ஆயில் (5%)', baseRatios: [{name: 'Deseeded Soapnut Powder', nameTa: 'பூந்திகொட்டை பொடி', ratio: 0.40}, {name: 'Washing Soda (Sodium Carbonate)', nameTa: 'வாஷிங் சோடா', ratio: 0.30}, {name: 'Baking Soda (Sodium Bicarbonate)', nameTa: 'பேக்கிங் சோடா', ratio: 0.15}, {name: 'Coarse Rock Salt', nameTa: 'கல் உப்பு பொடி', ratio: 0.10}, {name: 'Lemon Essential Oil', nameTa: 'எலுமிச்சை ஆயில்', ratio: 0.05}],
            steps: ['Ingredient Preparation: Ensure Soapnut powder is ultra-fine (#100 mesh) and completely dry to prevent clumping.', 'Dry Blending: Combine Soapnut powder, Washing Soda, Baking Soda, and fine Rock Salt in a ribbon blender.', 'Oil Fragrance Dispersion: Spray Lemon essential oil evenly over the tumbling dry powder mix.', 'Blending Cycle: Run blender for 20 minutes to distribute oil particles without causing moisture lumps.', 'Packaging: Pack into 1 kg moisture-proof thick pouch bags with scoop spoons and heat-seal.'],
            stepsTa: ['தயாரிப்பு: பூந்திகொட்டை பொடி கட்டியில்லாமல் காய்ந்து நைஸாக உள்ளதை உறுதி செய்யவும்.', 'உலர் கலவை: பூந்திகொட்டை பொடி, வாஷிங் சோடா, பேக்கிங் சோடா மற்றும் உப்பு பொடியை ஒன்றாகச் சேர்க்கவும்.', 'வாசனை எண்ணெய் தெளித்தல்: எலுமிச்சை எசென்ஷியல் ஆயிலை பொடியின் மீது லேசாகத் தெளிக்கவும்.', 'கலத்தல்: கட்டிகள் விழாதவாறு கலவை எந்திரத்தில் 20 நிமிடங்கள் நன்றாகக் கலக்கவும்.', 'பேக்கிங்: ஈரம் புகாத 1 கிலோ பவுச்சுகளில் அளவுக் கரண்டியுடன் அடைத்து சீல் செய்யவும்.'] },
          { id: 305, name: 'Herbal Toilet Bowl Cleaner', nameTa: 'மூலிகை கழிப்பறை சுத்திகரிப்பான்', category: 'Household', details: 'Concentrated Citrus Bio-Enzyme (50%), Soapnut Thick Extract (25%), Xanthan Gum Thickener (3%), Citric Acid (15%), Eucalyptus & Peppermint EO (7%)', detailsTa: 'அடர் எலுமிச்சை பயோ-என்சைம் (50%), பூந்திகொட்டை அடர் சாறு (25%), இயற்கை பிசின் திக்னர் (3%), சிட்ரிக் அமிலம் (15%), யூகலிப்டஸ் & புதினா ஆயில் (7%)', baseRatios: [{name: 'Concentrated Citrus Bio-Enzyme', nameTa: 'அடர் எலுமிச்சை பயோ-என்சைம்', ratio: 0.50}, {name: 'Soapnut Thick Liquid Extract', nameTa: 'பூந்திகொட்டை அடர் சாறு', ratio: 0.25}, {name: 'Xanthan Gum / Plant Gel Thickener', nameTa: 'இயற்கை பிசின் திக்னர்', ratio: 0.03}, {name: 'Organic Acids (Citric Acid Base)', nameTa: 'சிட்ரிக் அமிலம்', ratio: 0.15}, {name: 'Eucalyptus & Peppermint Oil Blend', nameTa: 'யூகலிப்டஸ் & புதினா ஆயில்', ratio: 0.07}],
            steps: ['Gelation Base: Hydrate Xanthan gum in warm Purified Water/Bio-Enzyme until a smooth gel matrix forms.', 'Acid & Surfactant Dissolution: Add Citric Acid powder and Soapnut thick extract into the gel base while stirring continuously.', 'Active Enzyme Addition: Blend in Concentrated Citrus Bio-Enzyme smoothly.', 'Antimicrobial Scenting: Stir in Eucalyptus and Peppermint oil blend to provide strong odor elimination.', 'Viscosity Testing & Bottling: Verify thick cling gel consistency. Fill into 500ml angular squeeze-nozzle toilet cleaner bottles.'],
            stepsTa: ['ஜெல் தயாரிப்பு: ஸாந்தன் கம் பிசினை வெதுவெதுப்பான பயோ-என்சைமில் கரைத்து ஜெல்லாக மாற்றவும்.', 'அமிலம் & சாறு கலத்தல்: சிட்ரிக் அமிலம் மற்றும் பூந்திகொட்டை அடர் சாறை ஜெல்லுடன் சேர்த்து மெதுவாகக் கலக்கவும்.', 'என்சைம் சேர்த்தல்: அடர் எலுமிச்சை பயோ-என்சைமை ஊற்றிக் கிளறவும்.', 'துர்நாற்ற நாசினி: யூகலிப்டஸ் மற்றும் புதினா ஆயிலைச் சேர்த்து நல்ல வாசனை வரும் வரை கலக்கவும்.', 'பேக்கிங்: தடிமனான ஜெல் பதத்தை உறுதி செய்து 500 மிலி கோண மூடி கொண்ட பாட்டில்களில் அடைக்கவும்.'] },
          { id: 306, name: 'Mosquito Repellent Vaporizer / Incense', nameTa: 'மூலிகை கொசு விரட்டி', category: 'Household', details: 'Neem Leaf Powder (30%), Nochi Leaf Powder (25%), Lemongrass Powder (20%), Sambrani Powder (10%), Jiggat Binding Powder (10%), Citronella & Neem EO (5%)', detailsTa: 'வேப்பிலை பொடி (30%), நொச்சி இலை பொடி (25%), எலுமிச்சம்புல் பொடி (20%), வெண் சாம்பிராணி (10%), ஜிக்காட் மரப்பிசின் பொடி (10%), சிட்ரோனெல்லா & வேப்ப எண்ணெய் (5%)', baseRatios: [{name: 'Neem Leaf Powder (Vepillai)', nameTa: 'வேப்பிலை பொடி', ratio: 0.30}, {name: 'Nochi Leaf Powder (Vitex Negundo)', nameTa: 'நொச்சி இலை பொடி', ratio: 0.25}, {name: 'Lemongrass Powder', nameTa: 'எலுமிச்சம்புல் பொடி', ratio: 0.20}, {name: 'Sambrani / White Dammar Powder', nameTa: 'வெண் சாம்பிராணி', ratio: 0.10}, {name: 'Jiggat Natural Binding Powder', nameTa: 'ஜிக்காட் மரப்பிசின் பொடி', ratio: 0.10}, {name: 'Citronella & Neem Essential Oil', nameTa: 'சிட்ரோனெல்லா & வேப்ப எண்ணெய்', ratio: 0.05}],
            steps: ['Herbal Milling: Grind sun-dried Neem, Nochi, and Lemongrass into fine powders (#100 mesh).', 'Binder & Resins: Blend in finely crushed White Dammar (Sambrani) and natural Jiggat binder powder.', 'Oil Infusion & Dough Kneading: Add Citronella and Neem essential oils. Gradually add water and knead into a firm dough.', 'Cone Extrusion: Press dough into incense cone molds or extrude through a cone-making machine.', 'Drying & Packing: Shade-dry cones for 48 hours until completely hardened. Pack 30 cones per box with a ceramic burner stand.'],
            stepsTa: ['மூலிகை அரைப்பு: காயவைத்த வேப்பிலை, நொச்சி மற்றும் எலுமிச்சம்புல்லை நைஸாக அரைக்கவும்.', 'பிசின் சேர்த்தல்: வெண் சாம்பிராணி பொடி மற்றும் ஜிக்காட் மரப்பிசின் பொடியை ஒன்றாகக் கலக்கவும்.', 'பிசைதல்: சிட்ரோனெல்லா, வேப்ப எண்ணெய் மற்றும் தண்ணீர் சேர்த்து தடிமனான மாவாகப் பிசையவும்.', 'கூம்பு வடிவம்: மாவை சாம்பிராணி கூம்பு அச்சுகளில் கொடுத்து கூம்பு வடிவில் பிதுக்கவும்.', 'உலர்த்துதல் & பேக்கிங்: 48 மணி நேரம் நிழலில் காயவைத்து, பாக்ஸிற்கு 30 கூம்புகள் வீதம் பீங்கான் தட்டுடன் பேக் செய்யவும்.'] },
          { id: 307, name: 'Dhoop Sticks & Camphor Cones', nameTa: 'மூலிகை சாம்பிராணி கூம்பு', category: 'Household', details: 'Pure Loban/Milk Sambrani (35%), Cow Dung Powder (25%), Kuppaimeni & Tulsi Powder (15%), Pachai Karpooram (10%), Tree Gum Binder (10%), Rose & Sandalwood EO (5%)', detailsTa: 'பால் சாம்பிராணி (35%), நாட்டு மாட்டு சாணப் பொடி (25%), குப்பைமேனி & துளசி பொடி (15%), பச்சை கற்பூரம் (10%), இயற்கை மரப்பிசின் (10%), ரோஜா & சந்தன ஆயில் (5%)', baseRatios: [{name: 'Pure Loban / Milk Sambrani', nameTa: 'பால் சாம்பிராணி', ratio: 0.35}, {name: 'Desi Cow Dung Powder (Dried & Filtered)', nameTa: 'நாட்டு மாட்டு சாணப் பொடி', ratio: 0.25}, {name: 'Kupaimeni & Tulsi Powder', nameTa: 'குப்பைமேனி & துளசி பொடி', ratio: 0.15}, {name: 'Pachai Karpooram (Bhimseni Camphor)', nameTa: 'பச்சை கற்பூரம்', ratio: 0.10}, {name: 'Natural Tree Gum Binder', nameTa: 'இயற்கை மரப்பிசின்', ratio: 0.10}, {name: 'Rose & Sandalwood Oil Blend', nameTa: 'ரோஜா & சந்தன ஆயில்', ratio: 0.05}],
            steps: ['Resin & Camphor Crushing: Powder Milk Sambrani and Bhimseni Camphor into fine grains using a mortar and pestle.', 'Dry Base Mix: Combine cow dung powder, Kuppaimeni, Tulsi, and natural tree gum binder in a bowl.', 'Dough Formation: Add crushed camphor-sambrani mix and Rose/Sandalwood oil blend. Add minimal water and knead into thick dhoop dough.', 'Shaping: Roll into dhoop sticks or press into dhoop cup molds.', 'Curing & Packaging: Shade-dry for 3 days until moisture evaporates completely. Pack 20 pieces per moisture-proof rigid box.'],
            stepsTa: ['சாம்பிராணி அரைப்பு: பால் சாம்பிராணி மற்றும் பச்சை கற்பூரத்தைக் உரலில் இடித்து நைஸாகப் பொடிக்கவும்.', 'உலர் கலவை: சாணப் பொடி, குப்பைமேனி, துளசி மற்றும் மரப்பிசின் பொடியைக் கலக்கவும்.', 'மாவு பிசைதல்: இடித்த சாம்பிராணி-கற்பூரம், வாசனை எண்ணெய் மற்றும் தண்ணீர் சேர்த்து தடிமனாகப் பிசையவும்.', 'வடிவம் அமைத்தல்: தூப் ஸ்டிக்குகளாக உருட்டவும் அல்லது கப் அச்சுகளில் அழுத்தவும்.', 'பேக்கிங்: 3 நாட்கள் நிழலில் காயவைத்து, பாக்ஸிற்கு 20 எண்ணிக்கையில் பேக் செய்யவும்.'] },

          // ==================== COLD PROCESS SOAPS (9 VARIETIES) ====================
          { id: 2001, name: 'Bioenzyme Cold Process Soap', nameTa: 'பயோஎன்சைம் கோல்ட் ப்ராசஸ் சோப்', category: 'Cold Process', details: 'Coconut Oil (450g), Castor Oil (25g), Butter (25g), Lye (87.5g), Bioenzyme (87.5g)[cite: 1]', detailsTa: 'தேங்காய் எண்ணெய் (450 கி), ஆமணக்கு எண்ணெய் (25 கி), வெண்ணெய் (25 கி), லை (87.5 கி), பயோஎன்சைம் (87.5 கி)', baseRatios: [{name: 'Coconut Oil', nameTa: 'தேங்காய் எண்ணெய்', ratio: 0.66}, {name: 'Castor Oil', nameTa: 'ஆமணக்கு எண்ணெய்', ratio: 0.04}, {name: 'Butter', nameTa: 'வெண்ணெய்', ratio: 0.04}, {name: 'Caustic Soda (Lye)', nameTa: 'காஸ்டிக் சோடா (லை)', ratio: 0.13}, {name: 'Bioenzyme Liquid', nameTa: 'பயோஎன்சைம் திரவம்', ratio: 0.13}], steps: ['Safety First: Wear gloves, goggles, and long sleeves. Work in a well-ventilated area.', 'Lye Solution: Slowly add caustic soda (Lye) to cold water or frozen milk. Never reverse. Stir until dissolved. Temperature rises to ~80°C — allow to cool to 40°C.', 'Melt Oils: Gently melt solid butters in a double boiler. Combine with liquid oils. Heat to 40–45°C.', 'Mix at Trace: When both lye solution and oils are at ~40°C, slowly pour lye into oils. Stick-blend to light trace.', 'Add Additives: Stir in herbal powders, bioenzyme (if applicable), and essential oils.', 'Pour into Mold: Pour batter into a lined mold. Tap on counter to release air bubbles.', 'Gel Phase: Insulate mold with a cardboard box or towels for 24 hours to encourage full gel.', 'Unmold & Cut: Unmold after 24–48 hours and cut into bars.', 'Cure: Cure bars on a rack in a ventilated room for 4–6 weeks before use or packaging.'], stepsTa: ['பாதுகாப்பு முதலில்: கையுறை, கண்ணாடி மற்றும் நீண்ட கை ஆடை அணியவும். காற்றோட்டமான இடத்தில் பணியாற்றவும்.', 'லை கரைசல்: காஸ்டிக் சோடாவை குளிர்ந்த நீரில் அல்லது உறைந்த பாலில் மெதுவாகச் சேர்க்கவும். தலைகீழாக சேர்க்காதீர்கள். கரையும் வரை கிளறவும். வெப்பம் ~80°C ஆகும் — 40°C வரை ஆறவிடவும்.', 'எண்ணெய் உருக்குதல்: திட வெண்ணெய்களை டபுள் பாய்லரில் மெதுவாக உருக்கவும். திரவ எண்ணெய்களுடன் சேர்க்கவும். 40–45°C வரை சூடாக்கவும்.', 'ட்ரேஸில் கலக்குதல்: லை கரைசலும் எண்ணெய்களும் ~40°C ஆனதும், லையை எண்ணெய்களில் மெதுவாக ஊற்றவும். லைட் ட்ரேஸ் வரும் வரை ஸ்டிக் பிளெண்டரால் கலக்கவும்.', 'சேர்க்கைகள்: மூலிகைப் பொடிகள், பயோஎன்சைம் (தேவைப்பட்டால்) மற்றும் அத்தார் எண்ணெய் சேர்த்துக் கிளறவும்.', 'அச்சில் ஊற்றுதல்: லைன் செய்த அச்சில் சோப் பேட்டரை ஊற்றவும். குமிழிகளை நீக்க மேசையில் தட்டவும்.', 'ஜெல் பேஸ்: முழு ஜெல் கட்டத்திற்கு 24 மணி நேரம் அட்டைப்பெட்டி அல்லது துண்டுகளால் அச்சை மூடி வைக்கவும்.', 'அச்சு நீக்கம் & வெட்டுதல்: 24–48 மணி நேரத்திற்குப் பிறகு அச்சிலிருந்து எடுத்து பார்களாக வெட்டவும்.', 'க்யூரிங்: காற்றோட்டமான அறையில் 4–6 வாரங்கள் க்யூர் செய்த பிறகே பயன்படுத்தவும் அல்லது பேக்கிங் செய்யவும்.'] },

சூடாக்கவும்.', 'ட்ரேஸில் கலக்குதல்: லை கரைசலும் எண்ணெய்களும் ~40°C ஆனதும், லையை எண்ணெய்களில் மெதுவாக ஊற்றவும். லைட் ட்ரேஸ் வரும் வரை ஸ்டிக் பிளெண்டரால் கலக்கவும்.', 'சேர்க்கைகள்: மூலிகைப் பொடிகள், பயோஎன்சைம் (தேவைப்பட்டால்) மற்றும் அத்தார் எண்ணெய் சேர்த்துக் கிளறவும்.', 'அச்சில் ஊற்றுதல்: லைன் செய்த அச்சில் சோப் பேட்டரை ஊற்றவும். குமிழிகளை நீக்க மேசையில் தட்டவும்.', 'ஜெல் பேஸ்: முழு ஜெல் கட்டத்திற்கு 24 மணி நேரம் அட்டைப்பெட்டி அல்லது துண்டுகளால் அச்சை மூடி வைக்கவும்.', 'அச்சு நீக்கம் & வெட்டுதல்: 24–48 மணி நேரத்திற்குப் பிறகு அச்சிலிருந்து எடுத்து பார்களாக வெட்டவும்.', 'க்யூரிங்: காற்றோட்டமான அறையில் 4–6 வாரங்கள் க்யூர் செய்த பிறகே பயன்படுத்தவும் அல்லது பேக்கிங் செய்யவும்.'] },
