்களில் மெதுவாக ஊற்றவும். லைட் ட்ரேஸ் வரும் வரை ஸ்டிக் பிளெண்டரால் கலக்கவும்.', 'சேர்க்கைகள்: மூலிகைப் பொடிகள், பயோஎன்சைம் (தேவைப்பட்டால்) மற்றும் அத்தார் எண்ணெய் சேர்த்துக் கிளறவும்.', 'அச்சில் ஊற்றுதல்: லைன் செய்த அச்சில் சோப் பேட்டரை ஊற்றவும். குமிழிகளை நீக்க மேசையில் தட்டவும்.', 'ஜெல் பேஸ்: முழு ஜெல் கட்டத்திற்கு 24 மணி நேரம் அட்டைப்பெட்டி அல்லது துண்டுகளால் அச்சை மூடி வைக்கவும்.', 'அச்சு நீக்கம் & வெட்டுதல்: 24–48 மணி நேரத்திற்குப் பிறகு அச்சிலிருந்து எடுத்து பார்களாக வெட்டவும்.', 'க்யூரிங்: காற்றோட்டமான அறையில் 4–6 வாரங்கள் க்யூர் செய்த பிறகே பயன்படுத்தவும் அல்லது பேக்கிங் செய்யவும்.'] },
          { id: 2006, name: 'Kasturi Manjal Sun-Infused CP Soap', nameTa: 'கஸ்தூரி மஞ்சள் சன்-இன்ஃபியூஸ்டு கோல்ட் ப்ராசஸ் சோப்', category: 'Cold Process', details: 'Coconut Oil (90g), Castor (5g), Kasturi Manjal Powder (145g), Lye (12.5g)[cite: 1]', detailsTa: 'தேங்காய் எண்ணெய் (90 கி), ஆமணக்கு (5 கி), கஸ்தூரி மஞ்சள் பொடி (145 கி), லை (12.5 கி)', baseRatios: [{name: 'Coconut Oil', nameTa: 'தேங்காய் எண்ணெய்', ratio: 0.35}, {name: 'Castor Oil', nameTa: 'ஆமணக்கு எண்ணெய்', ratio: 0.02}, {name: 'Herbal Powders', nameTa: 'மூலிகைப் பொடிகள்', ratio: 0.58}, {name: 'Caustic Soda (Lye)', nameTa: 'காஸ்டிக் சோடா (லை)', ratio: 0.05}], steps: ['Safety First: Wear gloves, goggles, and long sleeves. Work in a well-ventilated area.', 'Lye Solution: Slowly add caustic soda (Lye) to cold water or frozen milk. Never reverse. Stir until dissolved. Temperature rises to ~80°C — allow to cool to 40°C.', 'Melt Oils: Gently melt solid butters in a double boiler. Combine with liquid oils. Heat to 40–45°C.', 'Mix at Trace: When both lye solution and oils are at ~40°C, slowly pour lye into oils. Stick-blend to light trace.', 'Add Additives: Stir in herbal powders, bioenzyme (if applicable), and essential oils.', 'Pour into Mold: Pour batter into a lined mold. Tap on counter to release air bubbles.', 'Gel Phase: Insulate mold with a cardboard box or towels for 24 hours to encourage full gel.', 'Unmold & Cut: Unmold after 24–48 hours and cut into bars.', 'Cure: Cure bars on a rack in a ventilated room for 4–6 weeks before use or packaging.'], stepsTa: ['பாதுகாப்பு முதலில்: கையுறை, கண்ணாடி மற்றும் நீண்ட கை ஆடை அணியவும். காற்றோட்டமான இடத்தில் பணியாற்றவும்.', 'லை கரைசல்: காஸ்டிக் சோடாவை குளிர்ந்த நீரில் அல்லது உறைந்த பாலில் மெதுவாகச் சேர்க்கவும். தலைகீழாக சேர்க்காதீர்கள். கரையும் வரை கிளறவும். வெப்பம் ~80°C ஆகும் — 40°C வரை ஆறவிடவும்.', 'எண்ணெய் உருக்குதல்: திட வெண்ணெய்களை டபுள் பாய்லரில் மெதுவாக உருக்கவும். திரவ எண்ணெய்களுடன் சேர்க்கவும். 40–45°C வரை சூடாக்கவும்.', 'ட்ரேஸில் கலக்குதல்: லை கரைசலும் எ           { id: 2008, name: 'Aavaram Poo Radiance CP Soap', nameTa: 'ஆவாரம் பூ ரேடியன்ஸ் கோல்ட் ப்ராசஸ் சோப்', category: 'Cold Process', details: 'Coconut Oil (250g), Aavaram Poo Oil (225g), Castor (25g), Lye (87.5g)[cite: 1]', detailsTa: 'தேங்காய் எண்ணெய் (250 கி), ஆவாரம் பூ எண்ணெய் (225 கி), ஆமணக்கு (25 கி), லை (87.5 கி)', baseRatios: [{name: 'Coconut Oil', nameTa: 'தேங்காய் எண்ணெய்', ratio: 0.81}, {name: 'Castor Oil', nameTa: 'ஆமணக்கு எண்ணெய்', ratio: 0.04}, {name: 'Caustic Soda (Lye)', nameTa: 'காஸ்டிக் சோடா (லை)', ratio: 0.15}], steps: ['Safety First: Wear gloves, goggles, and long sleeves. Work in a well-ventilated area.', 'Lye Solution: Slowly add caustic soda (Lye) to cold water or frozen milk. Never reverse. Stir until dissolved. Temperature rises to ~80°C — allow to cool to 40°C.', 'Melt Oils: Gently melt solid butters in a double boiler. Combine with liquid oils. Heat to 40–45°C.', 'Mix at Trace: When both lye solution and oils are at ~40°C, slowly pour lye into oils. Stick-blend to light trace.', 'Add Additives: Stir in herbal powders, bioenzyme (if applicable), and essential oils.', 'Pour into Mold: Pour batter into a lined mold. Tap on counter to release air bubbles.', 'Gel Phase: Insulate mold with a cardboard box or towels for 24 hours to encourage full gel.', 'Unmold & Cut: Unmold after 24–48 hours and cut into bars.', 'Cure: Cure bars on a rack in a ventilated room for 4–6 weeks before use or packaging.'], stepsTa: ['பாதுகாப்பு முதலில்: கையுறை, கண்ணாடி மற்றும் நீண்ட கை ஆடை அணியவும். காற்றோட்டமான இடத்தில் பணியாற்றவும்.', 'லை கரைசல்: காஸ்டிக் சோடாவை குளிர்ந்த நீரில் அல்லது உறைந்த பாலில் மெதுவாகச் சேர்க்கவும். தலைகீழாக சேர்க்காதீர்கள். கரையும் வரை கிளறவும். வெப்பம் ~80°C ஆகும் — 40°C வரை ஆறவிடவும்.', 'எண்ணெய் உருக்குதல்: திட வெண்ணெய்களை டபுள் பாய்லரில் மெதுவாக உருக்கவும். திரவ எண்ணெய்களுடன் சேர்க்கவும். 40–45°C வரை சூடாக்கவும்.', 'ட்ரேஸில் கலக்குதல்: லை கரைசலும் எண்ணெய்களும் ~40°C ஆனதும், லையை எண்ணெய்களில் மெதுவாக ஊற்றவும். லைட் ட்ரேஸ் வரும் வரை ஸ்டிக           // ==================== 100% LYE-FREE MELT & POUR SOAPS (50 VARIETIES) ====================
          { id: 1001, name: 'Pure Goat Milk Soap', nameTa: 'தூய வெள்ளாட்டு பால் சோப்', category: 'Lye-Free', details: 'Goat Milk Base (88%), Coconut Oil (4%), Sweet Almond (3%), Goat Milk Powder (2%)', detailsTa: 'வெள்ளாட்டு பால் பேஸ் (88%), தேங்காய் எண்ணெய் (4%), ஸ்வீட் ஆமண்ட் (3%), வெள்ளாட்டு பால் பொடி (2%)', baseRatios: [{name: 'Goat Milk Base', nameTa: 'வெள்ளாட்டு பால் பேஸ்', ratio: 0.88}, {name: 'Coconut Oil', nameTa: 'தேங்காய் எண்ணெய்', ratio: 0.04}, {name: 'Essential Oils', nameTa: 'அத்தார் எண்ணெய்கள்', ratio: 0.08}], steps: ['Weigh & Cut: Weigh soap base and cut into small cubes.', 'Melt: Melt in a double boiler or microwave in 30-second bursts, stirring until smooth. Do not overheat above 70°C.', 'Cool to 55°C: Allow melt to cool slightly before adding additives.', 'Add Oils & Powders: Stir in the weighed carrier oils and herbal powders.', 'Add Essential Oils: Add essential oils last and stir thoroughly.', 'Pour: Pour into molds. Spritz top with 91% isopropyl alcohol to eliminate bubbles.', 'Set: Allow to cool and harden for 4–6 hours or overnight before unmolding.', 'Cure & Package: Wrap in shrink film or pack into boxes. Label with batch date.'], stepsTa: ['எடை & வெட்டுதல்: சோப் பேஸை சிறிய துண்டுகளாக வெட்டி எடைபோடவும்.', 'உருக்குதல்: டபுள் பாய்லரில் அல்லது மைக்ரோவேவில் 30 விநாடி இடைவெளியில் கிளறி உருக்கவும். 70°C-க்கு மேல் சூடேற்றாதீர்கள்.', '55°C-க்கு ஆறவிடுதல்: சேர்க்கைகளைச் சேர்ப்பதற்கு முன் கொஞ்சம் ஆறவிடவும்.', 'எண்ணெய் & பொடி சேர்த்தல்: அளவிட்ட கேரியர் எண்ணெய்கள் மற்றும் மூலிகைப் பொடிகளை கிளறி சேர்க்கவும்.', 'அத்தார் எண்ணெய் சேர்த்தல்: கடைசியாக அத்தார் எண்ணெய் சேர்த்து நன்றாகக் கலக்கவும்.', 'ஊற்றுதல்: அச்சுகளில் ஊற்றவும். குமிழிகளை நீக்க மேல்பரப்பில் 91% ஐசோப்ரோபைல் ஆல்கஹால் தெளிக்கவும்.', 'உறைவிடுதல்: அச்சிலிருந்து எடுப்பதற்கு முன் 4–6 மணி நேரம் அல்லது இரவு முழுவதும் ஆறவிடவும்.', 'சீக்கு & பேக்கிங்: ஷ்ரிங்க் ஃபிலிமில் சுற்றி பேக்கெட்டில் அடைக்கவும். தேதி லேபிள் ஒட்டவும்.'] },

        init() {
          const savedItems = this.loadFromStorage('srilaya-green-ops-items');
          this.items = savedItems || this.defaultItems;
          this.$watch('items', value => this.saveToStorage('srilaya-green-ops-items', value));

          try {
            this.sbClient = window.supabase.createClient(this.SUPABASE_URL, this.SUPABASE_ANON_KEY);
          } catch (e) {
            this.sbClient = null;
          }
          this.syncFromCloud();

          // Auto-lock after 10 minutes of inactivity
          const resetTimer = () => {
            clearTimeout(this._lockTimer);
            if (this.isUnlocked) {
              this._lockTimer = setTimeout(() => { this.isUnlocked = false; }, 10 * 60 * 1000);
            }
          };
          ['touchstart', 'mousedown', 'keydown'].forEach(e => document.addEventListener(e, resetTimer, { passive: true }));
          this.$watch('isUnlocked', v => { if (v) resetTimer(); else clearTimeout(this._lockTimer); });

          // Flush offline write queue when connectivity is restored
          window.addEventListener('online', () => this.flushOfflineQueue());
          const savedQueue = this.loadFromStorage('srilaya-green-ops-queue');
          if (savedQueue) this._offlineQueue = savedQueue;
        },

        async syncFromCloud() {
          if (!this.sbClient) return;
          this.syncStatus = 'syncing';
          try {
            const { data, error } = await this.sbClient
              .from('GreenOpsRecipe')
              .select('id, name, category, details, baseRatios')
              .order('name', { ascending: true });

            if (error) throw error;

            if (data && data.length > 0) {
              const localOnlyItems = this.items.filter(i => !this.SYNCED_CATEGORIES.includes(i.category));
              this.items = [...data, ...localOnlyItems];
            }
            this.syncStatus = 'synced';
          } catch (e) {
            this.syncStatus = 'offline';
          }
        },

        async pushUpsert(record) {
          if (!this.SYNCED_CATEGORIES.includes(record.category)) return;
          if (!this.sbClient) { this._enqueue({ op: 'upsert', payload: record }); return; }
          try {
            const { error } = await this.sbClient.from('GreenOpsRecipe').upsert({
              id: String(record.id),
              name: record.name,
              category: record.category,
              details: record.details,
              baseRatios: record.baseRatios,
            });
            if (error) throw error;
            this.syncStatus = 'synced';
          } catch (e) {
            this.syncStatus = 'offline';
            this._enqueue({ op: 'upsert', payload: record });
          }
        },

        async pushDelete(id, category) {
          if (!this.SYNCED_CATEGORIES.includes(category)) return;
          if (!this.sbClient) { this._enqueue({ op: 'delete', payload: { id, category } }); return; }
          try {
            const { error } = await this.sbClient.from('GreenOpsRecipe').delete().eq('id', String(id));
            if (error) throw error;
            this.syncStatus = 'synced';
          } catch (e) {
            this.syncStatus = 'offline';
            this._enqueue({ op: 'delete', payload: { id, category } });
          }
        },

        _enqueue(item) {
          this._offlineQueue = this._offlineQueue.filter(q =>
            !(q.payload.id === item.payload.id && q.op === item.op)
          );
          this._offlineQueue.push(item);
          this.saveToStorage('srilaya-green-ops-queue', this._offlineQueue);
        },

        async flushOfflineQueue() {
          if (!this.sbClient || this._offlineQueue.length === 0) return;
          const queue = [...this._offlineQueue];
          this._offlineQueue = [];
          this.saveToStorage('srilaya-green-ops-queue', []);
          for (const item of queue) {
            if (item.op === 'upsert') await this.pushUpsert(item.payload);
            else if (item.op === 'delete') await this.pushDelete(item.payload.id, item.payload.category);
          }
        },

        loadFromStorage(key) {
          try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : null;
          } catch (e) {
            return null;
          }
        },
        saveToStorage(key, value) {
          try {
            localStorage.setItem(key, JSON.stringify(value));
          } catch (e) {}
        },

        get filteredItems() {
          const q = this.searchQuery.trim().toLowerCase();
          return this.items.filter(item => {
            const matchesCategory = this.selectedCategory === 'All' || item.category === this.selectedCategory;
            const matchesSearch = !q ||
              item.name.toLowerCase().includes(q) ||
              (item.nameTa || '').toLowerCase().includes(q) ||
              (item.details || '').toLowerCase().includes(q) ||
              (item.detailsTa || '').toLowerCase().includes(q);
            return matchesCategory && matchesSearch;
          });
        },

        get allIngredientNames() {
          const names = new Set();
          this.items.forEach(item => item.baseRatios.forEach(ing => names.add(ing.name)));
          return Array.from(names).sort();
        },

        requireUnlock(action) {
          if (this.isUnlocked) { action(); return; }
          this.pendingAction = action;
          this.pinPromptOpen = true;
          this.pinInput = '';
          this.pinError = false;
        },
        submitPin() {
          if (this.pinInput === this.editPin) {
            this.isUnlocked = true;
            this.pinPromptOpen = false;
            const action = this.pendingAction;
            this.pendingAction = null;
            if (action) action();
          } else {
            this.pinError = true;

        cancelPinPrompt() {
          this.pinPromptOpen = false;

          this.showAddModal = false;
        },
        addIngredientRow() {
          this.newRecipe.ingredients.push({ name: '', parts: null });
        },
        removeIngredientRow(idx) {
          if (this.newRecipe.ingredients.length > 1) this.newRecipe.ingredients.splice(idx, 1);
        },
        ingredientPreviewPct(ing) {
          const total = this.newRecipe.ingredients.reduce((sum, i) => sum + (Number(i.parts) || 0), 0);
          if (!total || !ing.parts) return '0%';
          return Math.round((Number(ing.parts) / total) * 1000) / 10 + '%';
        },
        get canSaveNewRecipe() {
          return this.newRecipe.name.trim() && this.newRecipe.ingredients.some(i => i.name && i.parts);
        },
        saveNewRecipe() {
          const valid = this.newRecipe.ingredients.filter(i => i.name && i.parts);
          const total = valid.reduce((sum, i) => sum + Number(i.parts), 0);
          const baseRatios = valid.map(i => ({ name: i.name, ratio: Number(i.parts) / total }));
          if (this.editingItemId) {
            const idx = this.items.findIndex(i => i.id === this.editingItemId);
            if (idx !== -1) {
              this.items[idx] = { ...this.items[idx], name: this.newRecipe.name, category: this.newRecipe.category, details: this.newRecipe.details, baseRatios };
              this.pushUpsert(this.items[idx]);
            }
          } else {
            const nextId = Math.max(0, ...this.items.map(i => i.id)) + 1;
            const record = { id: nextId, name: this.newRecipe.name, category: this.newRecipe.category, details: this.newRecipe.details, baseRatios };
            this.items.push(record);
            this.pushUpsert(record);
          }
          this.showAddModal = false;
        },
        deleteItem(item) {
          if (!confirm(`Delete "${item.name}"? This cannot be undone.`)) return;
          this.pushDelete(item.id, item.category);
          this.items = this.items.filter(i => i.id !== item.id);
        },

        exportCSV(item) {
          const rows = [['Ingredient', 'Ratio (%)'], ...item.baseRatios.map(ing => [ing.name, (ing.ratio * 100).toFixed(1)])];
          const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
          const blob = new Blob([csv], { type: 'text/csv' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.setAttribute('download', `${item.name.toLowerCase().replace(/\s+/g, '_')}_recipe.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        },

        restoreDefaults() {
          const existingIds = new Set(this.items.map(i => i.id));
          const missing = this.defaultItems.filter(i => !existingIds.has(i.id));
          if (missing.length === 0) {
            alert('All default recipes are already present — nothing to restore.');
            return;
          }
          this.items = [...this.items, ...missing];
          missing.forEach(r => this.pushUpsert(r));
          alert(`Restored ${missing.length} missing recipe${missing.length > 1 ? 's' : ''}.`);
        },

        exportAllData() {
          const blob = new Blob([JSON.stringify(this.items, null, 2)], { type: 'application/json' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.setAttribute('download', `srilaya_green_ops_backup_${new Date().toISOString().slice(0,10)}.json`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        },
        importAllData(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = e => {
            try {
              const items = JSON.parse(e.target.result);
              if (!Array.isArray(items)) throw new Error('Invalid backup file');
              const ok = confirm(`Replace your current ${this.items.length} recipes with ${items.length} recipes from this backup? This cannot be undone.`);
              if (ok) this.items = items;
            } catch (err) {
              alert('Could not read backup file: ' + err.message);
            }
          };
          reader.readAsText(file);
          event.target.value = '';
        }
      };
    }

    // SERVICE WORKER FOR OFFLINE PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
