version: 2
# DISABLED: Dependabot is paused during development (open-pull-requests-limit: 0).
# TO RE-ENABLE before go-live: set open-pull-requests-limit back to 5 (or remove the line).
# Also ensure CI workflows handle Dependabot PRs gracefully before re-enabling
# (Vercel preview deployments are not created for Dependabot on Hobby plan).
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 0
    groups:
      next-ecosystem:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      sentry:
        patterns: ["@sentry/*", "sentry"]
      auth:
        patterns: ["next-auth", "@auth/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
