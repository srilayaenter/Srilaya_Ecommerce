name: Staging smoke

on:
  # Gate: every PR targeting main must pass before it can merge
  pull_request:
    branches: [main]
  # CI: run on every push to staging so failures are caught before a PR is opened
  push:
    branches: [staging]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: smoke / smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Runtime ───────────────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 3. Playwright browsers (chromium only for speed) ────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}

      - name: Install Playwright (chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system deps (cached hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # ── 4. Unit tests (fast, no network) ────────────────────────────────────
      - name: Run unit tests
        run: pnpm test:unit

      # ── 5. Wait for Vercel preview deployment ───────────────────────────────
      #
      # Vercel registers a GitHub Deployment for every push/PR. We poll the
      # GitHub Deployments API (no extra secrets needed — GITHUB_TOKEN is built-in)
      # until the deployment succeeds, then extract the preview URL.
      #
      - name: Wait for Vercel preview URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          else
            SHA="${{ github.sha }}"
          fi

          # Always use the stable branch URL. Per-commit preview URLs cold-start
          # on every push; the branch URL reuses warm function instances.
          STABLE_URL="https://srilaya-ecommerce-git-staging-avrsrikanth-4431s-projects.vercel.app"

          echo "Waiting for Vercel deployment (SHA: $SHA)..."
          echo "Target: $STABLE_URL"

          # Phase 1: Wait up to 3 min for a GitHub Deployment entry. This
          # confirms Vercel has started building. If Vercel doesn't register one
          # (it occasionally skips this for rapid pushes), fall through to Phase 2.
          DEPLOY_FOUND=false
          for i in $(seq 1 18); do
            DEPLOY_JSON=$(gh api \
              "repos/${{ github.repository }}/deployments?sha=$SHA&per_page=20" \
              2>/dev/null || echo "[]")

            DEPLOY_ID=$(echo "$DEPLOY_JSON" \
              | jq -r 'map(select(.environment | ascii_downcase | test("preview"))) | first | .id // empty')

            if [ -n "$DEPLOY_ID" ] && [ "$DEPLOY_ID" != "null" ]; then
              echo "  Found deployment $DEPLOY_ID (attempt $i)"
              DEPLOY_FOUND=true
              break
            fi

            echo "  No GitHub Deployment entry yet (attempt $i/18)"
            sleep 10
          done

          if [ "$DEPLOY_FOUND" = "true" ]; then
            # Phase 2a: deployment entry found — wait for it to reach success/failure
            echo "  Polling deployment $DEPLOY_ID for completion..."
            for j in $(seq 1 36); do
              STATUS_JSON=$(gh api \
                "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" \
                2>/dev/null || echo "[]")
              STATE=$(echo "$STATUS_JSON" | jq -r 'first | .state // empty')
              echo "    state=$STATE (poll $j/36)"

              if [ "$STATE" = "success" ]; then
                echo "  Deployment succeeded — proceeding with $STABLE_URL"
                echo "url=$STABLE_URL" >> "$GITHUB_OUTPUT"
                exit 0
              elif [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
                echo "ERROR: Vercel build failed (state=$STATE) — aborting"
                exit 1
              fi
              sleep 10
            done
            echo "WARNING: deployment never reached success after 6 min — proceeding anyway"
          else
            # Phase 2b: Vercel didn't register a GitHub Deployment (can happen
            # when pushes are rapid or Vercel's GitHub app is lagging). The
            # stable URL still serves the most recent successful build, so we
            # proceed and let the tests surface any regressions.
            echo "WARNING: No GitHub Deployment found for $SHA — using stable URL without build gate"
          fi

          echo "url=$STABLE_URL" >> "$GITHUB_OUTPUT"

      # ── 6. Run smoke tests ───────────────────────────────────────────────────
      - name: Run smoke tests
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Smoke tests are public-route only — no auth env vars needed
          CI: "true"
        run: |
          echo "Running smoke tests against: $TEST_BASE_URL"
          pnpm exec playwright test tests/e2e/smoke.spec.ts \
            --project=chromium \
            --reporter=list

      # ── 7. Upload Playwright report on failure ───────────────────────────────
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.run_id }}
          path: tests/report/
          retention-days: 7
